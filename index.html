<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Super Enkel Eksamen">
<!-- tittel og ikon settes av js/picker.js etter hvilket fag som er valgt -->
<title>Super Enkel Eksamen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232f6bff'/><text x='50' y='62' font-size='30' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SEE</text></svg>">
<style>
/* ============================================================
   Super Enkel Eksamen — design system (Apple-inspired, light)
   ============================================================ */
:root{
  --bg:#f5f5f7; --bg-elevated:#fff; --bg-sunken:#ecedf0; --card:#fff;
  --hairline:#e6e6ea; --hairline-strong:#d9d9e0;
  --ink:#1d1d1f; --ink-2:#44464b; --ink-3:#6e6e76; --ink-4:#98989f;
  --accent:#2f6bff; --accent-ink:#1b4fd6; --accent-soft:#eaf0ff; --accent-soft-2:#dbe6ff;
  --green:#2faa66; --green-soft:#e6f6ec; --amber:#e0902a; --amber-soft:#fbf0db;
  --rose:#e0566f; --rose-soft:#fce8ec; --indigo:#6366f1; --indigo-soft:#ecedfd;
  --teal:#18a3a8; --teal-soft:#e2f5f5; --slate:#5b6472; --slate-soft:#eef0f3;
  --phase-slate:#5b6472; --phase-teal:#18a3a8; --phase-green:#2faa66; --phase-indigo:#6366f1; --phase-amber:#e0902a; --phase-rose:#e0566f;
  --shadow-sm:0 1px 2px rgba(20,20,40,.04),0 1px 3px rgba(20,20,40,.06);
  --shadow-md:0 4px 16px rgba(20,20,40,.06),0 2px 6px rgba(20,20,40,.05);
  --shadow-lg:0 18px 48px rgba(20,20,40,.12),0 6px 16px rgba(20,20,40,.07);
  --shadow-accent:0 8px 24px rgba(47,107,255,.22);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-serif:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sidebar-w:256px; --maxw:1180px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,h4{letter-spacing:-.014em;line-height:1.18;margin:0;font-weight:650;}
a{color:var(--accent-ink);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;}
::selection{background:var(--accent-soft-2);}
*::-webkit-scrollbar{width:11px;height:11px;}
*::-webkit-scrollbar-thumb{background:#d4d4dc;border-radius:999px;border:3px solid var(--bg);}
*::-webkit-scrollbar-thumb:hover{background:#bcbcc6;}

.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--hairline);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;z-index:50;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 16px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#6f9bff);box-shadow:var(--shadow-accent);display:grid;place-items:center;color:#fff;font-weight:750;font-size:18px;letter-spacing:-.03em;flex:0 0 auto;}
.brand .bt{font-weight:680;font-size:15px;letter-spacing:-.02em;line-height:1.1;}
.brand .bs{font-size:11.5px;color:var(--ink-4);margin-top:1px;}
.nav-section{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);padding:14px 12px 5px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14.5px;font-weight:530;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .14s,color .14s;}
.nav-item .ico{width:19px;height:19px;flex:0 0 auto;opacity:.82;}
.nav-item:hover{background:var(--bg-sunken);text-decoration:none;}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:620;}
.nav-item.active .ico{opacity:1;}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:650;color:var(--ink-4);background:var(--bg-sunken);padding:1px 8px;border-radius:var(--r-pill);}
.nav-item.active .badge{background:#fff;color:var(--accent-ink);}
.sidebar-foot{margin-top:auto;padding:12px 12px 4px;border-top:1px solid var(--hairline);}
.sidebar-foot .mini-ring{display:flex;align-items:center;gap:10px;}
.sidebar-foot .mt{font-size:12px;color:var(--ink-3);}
.sidebar-foot .mt b{color:var(--ink);font-size:15px;}
.main{flex:1 1 auto;min-width:0;}
.content{max-width:var(--maxw);margin:0 auto;padding:40px 44px 96px;}
.page-head{margin-bottom:26px;}
.page-head .eyebrow{font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:8px;}
.page-head h1{font-size:33px;font-weight:700;letter-spacing:-.025em;}
.page-head p.sub{color:var(--ink-3);font-size:16px;margin:9px 0 0;max-width:64ch;}
.topbar{display:none;}
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px 24px;}
.card.pad-lg{padding:28px 30px;}
.card.flat{box-shadow:none;}
.grid{display:grid;gap:18px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.row{display:flex;gap:14px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.spacer{flex:1 1 auto;}
.stack{display:flex;flex-direction:column;}
.muted{color:var(--ink-3);}
.tiny{font-size:12.5px;}
.center{text-align:center;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.01em;padding:3px 10px;border-radius:var(--r-pill);background:var(--bg-sunken);color:var(--ink-2);}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink);}
.chip.green{background:var(--green-soft);color:#1d7a47;}
.chip.amber{background:var(--amber-soft);color:#9a630f;}
.chip.rose{background:var(--rose-soft);color:#b8324b;}
.chip.indigo{background:var(--indigo-soft);color:#4044c9;}
.chip.teal{background:var(--teal-soft);color:#0d7b7f;}
.chip.slate{background:var(--slate-soft);color:var(--slate);}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
svg.ico{width:1.05em;height:1.05em;flex:0 0 auto;}
.ico-wrap{display:inline-flex;align-items:center;}
.chip .ico-wrap svg{width:14px;height:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;padding:10px 18px;border-radius:var(--r-pill);background:var(--bg-sunken);color:var(--ink);border:1px solid transparent;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;text-decoration:none;}
.btn:hover{background:#e3e4e9;text-decoration:none;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-accent);}
.btn.primary:hover{background:var(--accent-ink);}
.btn.ghost{background:transparent;border-color:var(--hairline-strong);color:var(--ink-2);}
.btn.ghost:hover{background:var(--bg-sunken);}
.btn.sm{padding:7px 13px;font-size:13px;}
.btn.lg{padding:13px 24px;font-size:16px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg-sunken);border:none;cursor:pointer;color:var(--ink-2);}
.iconbtn:hover{background:#e3e4e9;}
.bar{height:9px;border-radius:999px;background:var(--bg-sunken);overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#6f9bff);transition:width .5s cubic-bezier(.2,.7,.2,1);}
.bar.green>span{background:linear-gradient(90deg,var(--green),#4cc985);}
.bar.thin{height:6px;}
.ring{position:relative;display:inline-grid;place-items:center;}
.ring svg{transform:rotate(-90deg);}
.ring .ring-bg{stroke:var(--bg-sunken);}
.ring .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1);}
.ring .ring-label{position:absolute;text-align:center;}
.ring .ring-label .v{font-size:26px;font-weight:720;letter-spacing:-.03em;}
.ring .ring-label .l{font-size:11px;color:var(--ink-3);margin-top:-2px;}
.stat{display:flex;flex-direction:column;gap:3px;}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.03em;}
.stat .l{font-size:13px;color:var(--ink-3);font-weight:500;}
.stat .k{font-size:12px;font-weight:600;}
.stat .k.up{color:var(--green);}
.hero{background:linear-gradient(140deg,#16243f 0%,#243a63 48%,#2f6bff 130%);color:#fff;border-radius:var(--r-xl);padding:30px 34px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);}
.hero .eyebrow{color:rgba(255,255,255,.8);font-weight:600;font-size:13px;letter-spacing:.04em;}
.hero h2{font-size:27px;font-weight:700;margin:7px 0 4px;letter-spacing:-.02em;}
.hero p{color:rgba(255,255,255,.85);margin:0;font-size:15px;max-width:56ch;}
.hero .hero-cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
.hero .btn.primary{background:#fff;color:var(--accent-ink);box-shadow:none;}
.hero .btn.primary:hover{background:#eef2ff;}
.hero .btn.ghost{border-color:rgba(255,255,255,.34);color:#fff;}
.hero .btn.ghost:hover{background:rgba(255,255,255,.12);}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px;}
.section-title h3{font-size:18px;font-weight:660;}
.section-title .see-all{margin-left:auto;font-size:13.5px;font-weight:560;color:var(--accent-ink);cursor:pointer;}
.task-row{display:flex;align-items:flex-start;gap:13px;padding:13px 4px;border-bottom:1px solid var(--hairline);}
.task-row:last-child{border-bottom:none;}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--hairline-strong);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:all .15s;background:#fff;}
.check:hover{border-color:var(--accent);}
.check.done{background:var(--green);border-color:var(--green);}
.task-row .tt{font-size:14.5px;font-weight:540;}
.task-row.done .tt{color:var(--ink-4);text-decoration:line-through;}
.task-row .td{font-size:13px;color:var(--ink-3);margin-top:1px;}
.concept-pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:560;cursor:pointer;}
.concept-pill:hover{background:var(--accent-soft-2);text-decoration:none;}
.day-card{display:flex;align-items:center;gap:16px;padding:18px 22px;cursor:pointer;}
.day-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);transition:all .16s;}
.day-num{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;text-align:center;background:var(--bg-sunken);flex:0 0 auto;}
.day-num .n{font-size:22px;font-weight:740;line-height:1;}
.day-num .d{font-size:10.5px;color:var(--ink-3);margin-top:3px;text-transform:uppercase;letter-spacing:.03em;}
.day-card.is-today .day-num{background:var(--accent);color:#fff;}
.day-card.is-today .day-num .d{color:rgba(255,255,255,.8);}
.day-card.is-done .day-num{background:var(--green-soft);}
.day-card.is-done .day-num .n{color:#1d7a47;}
.day-card .dtitle{font-size:16px;font-weight:620;letter-spacing:-.01em;}
.day-card .dmeta{font-size:13px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.phase-band{width:4px;align-self:stretch;border-radius:4px;background:var(--slate);}
.part-group{margin-bottom:30px;}
.part-head{display:flex;align-items:baseline;gap:12px;margin:0 4px 12px;}
.part-head .ptag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);}
.part-head .pname{font-size:14.5px;color:var(--ink-3);}
.part-head .pcount{margin-left:auto;font-size:12.5px;color:var(--ink-4);}
.chap-row{display:grid;grid-template-columns:40px 1fr auto auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--hairline);cursor:pointer;}
.chap-row:last-child{border-bottom:none;}
.chap-row:hover{background:var(--bg-sunken);}
.chap-row .cnum{width:40px;height:40px;border-radius:11px;background:var(--bg-sunken);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink-2);}
.chap-row.read .cnum{background:var(--green-soft);color:#1d7a47;}
.chap-row .ctitle{font-weight:560;font-size:14.5px;}
.chap-row .cmeta{font-size:12.5px;color:var(--ink-4);margin-top:2px;}
.status-dots{display:flex;gap:6px;}
.sdot{width:11px;height:11px;border-radius:50%;background:var(--bg-sunken);}
.sdot.read{background:var(--green);}
.sdot.understood{background:var(--accent);}
.sdot.unsure{background:var(--amber);}
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-pill);padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:none;padding:6px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:560;color:var(--ink-2);cursor:pointer;}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}
.u-picker{display:inline-flex;gap:6px;}
.u-picker button{border:1px solid var(--hairline-strong);background:#fff;border-radius:var(--r-pill);padding:5px 12px;font-size:12.5px;font-weight:560;cursor:pointer;color:var(--ink-2);}
.u-picker button.on.understood{background:var(--accent);color:#fff;border-color:var(--accent);}
.u-picker button.on.unsure{background:var(--amber);color:#fff;border-color:var(--amber);}
.article-wrap{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:36px;align-items:start;}
/* min-width:auto er standard for grid-barn, og hindrer dem i å krympe
   under innholdets bredde. Uten denne dikterer den bredeste tabellen
   bredden på hele kapitlet. */
.article-wrap>*{min-width:0;}
.prose{min-width:0;}
.article-toc{position:sticky;top:24px;}
.article-toc .tlabel{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4);margin-bottom:10px;padding-left:12px;}
.article-toc a{display:block;padding:6px 12px;font-size:13px;color:var(--ink-3);border-left:2px solid var(--hairline);border-radius:0 6px 6px 0;}
.article-toc a:hover{color:var(--ink);background:var(--bg-sunken);text-decoration:none;}
.article-toc a.active{color:var(--accent-ink);border-left-color:var(--accent);font-weight:560;}
.prose{font-size:16.5px;line-height:1.68;color:var(--ink);max-width:72ch;}
.prose h3{font-size:22px;font-weight:660;margin:1.6em 0 .5em;letter-spacing:-.02em;scroll-margin-top:20px;}
.prose h4{font-size:16px;font-weight:650;color:var(--ink-2);margin:1.5em 0 .4em;}
.prose p{margin:.7em 0;}
.prose ul,.prose ol{margin:.6em 0 1em;padding-left:1.35em;}
.prose li{margin:.35em 0;}
.prose strong,.prose b{color:var(--ink);font-weight:650;}
.prose em,.prose i{color:var(--ink-2);}
.prose code{background:var(--bg-sunken);padding:1px 6px;border-radius:6px;font-family:var(--mono);font-size:.9em;}
.prose sup,.prose sub{font-size:.72em;}
.prose .lead,.prose .lead-in{font-size:17px;color:var(--ink-2);font-style:normal;line-height:1.6;border-left:3px solid var(--accent-soft-2);padding:2px 0 2px 16px;margin:0 0 1.4em;}
.prose a{border-bottom:1px solid var(--accent-soft-2);}
.prose .formula{background:linear-gradient(180deg,#fbfcff,#f6f8ff);border:1px solid var(--accent-soft-2);border-radius:var(--r-md);padding:16px 20px;margin:1.3em 0;box-shadow:var(--shadow-sm);}
.prose .formula .eq{font-family:var(--font-serif);font-size:19px;text-align:center;margin:.35em 0;color:#14224a;}
.prose .formula .where{font-size:13.5px;color:var(--ink-3);margin-top:.6em;line-height:1.55;}
.prose .formula .where b{color:var(--accent-ink);font-style:normal;font-weight:620;}
.prose .callout{border-radius:var(--r-md);padding:15px 18px 15px 50px;margin:1.3em 0;position:relative;font-size:15px;line-height:1.6;border:1px solid transparent;}
.prose .callout:before{position:absolute;left:17px;top:14px;font-size:18px;}
.prose .callout .h{display:block;font-weight:680;font-size:13.5px;letter-spacing:.01em;text-transform:uppercase;margin-bottom:.35em;}
.prose .callout.tip{background:var(--green-soft);border-color:#cdeed8;}
.prose .callout.tip:before{content:"📘";}.prose .callout.tip .h{color:#1d7a47;}
.prose .callout.mistake{background:var(--amber-soft);border-color:#f2dcb6;}
.prose .callout.mistake:before{content:"⚠️";}.prose .callout.mistake .h{color:#9a630f;}
.prose .callout.mech{background:var(--accent-soft);border-color:var(--accent-soft-2);}
.prose .callout.mech:before{content:"⚙️";}.prose .callout.mech .h{color:var(--accent-ink);}
.prose .callout.link{background:var(--indigo-soft);border-color:#dcdefb;}
.prose .callout.link:before{content:"🔗";}.prose .callout.link .h{color:#4044c9;}
.prose .callout.warn{background:var(--rose-soft);border-color:#f6d5dc;}
.prose .callout.warn:before{content:"❗";}.prose .callout.warn .h{color:#b8324b;}
.prose .worked{background:#fff;border:1px dashed var(--hairline-strong);border-radius:var(--r-md);padding:16px 20px;margin:1.3em 0;}
.prose .worked .wh{text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);font-weight:700;font-size:12.5px;display:block;margin-bottom:.4em;}
/* Brede tabeller skal rulle for seg selv. Uten dette strekker de hele
   artikkelen bredere enn skjermen, og all brødteksten blir uleselig på mobil. */
.tabell-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1.3em 0;}
.tabell-scroll table.data{margin:0;}
.prose table.data{border-collapse:separate;border-spacing:0;width:100%;margin:1.3em 0;font-size:14px;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;}
.prose table.data th,.prose table.data td{border-bottom:1px solid var(--hairline);padding:9px 13px;text-align:left;}
.prose table.data tr:last-child td{border-bottom:none;}
.prose table.data th{background:var(--bg-sunken);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);}
.prose table.data td.n{text-align:right;font-variant-numeric:tabular-nums;}
.prose figure{margin:1.5em 0;text-align:center;}
.prose figure svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-sm);}
.prose figcaption{font-size:13px;color:var(--ink-3);margin-top:.6em;font-style:italic;max-width:60ch;margin-inline:auto;}
.prose blockquote{margin:1.2em 0;padding:4px 0 4px 18px;border-left:3px solid var(--accent-soft-2);color:var(--ink-2);font-style:italic;}
.prose .chip{background:var(--bg-sunken);color:var(--ink-2);}
.prose hr.sec,.prose .backtotop{display:none;}
.quiz-card{max-width:660px;margin:0 auto;}
.q-progress{display:flex;gap:5px;margin-bottom:22px;}
.q-progress span{flex:1;height:5px;border-radius:999px;background:var(--bg-sunken);}
.q-progress span.done{background:var(--accent);}
.q-progress span.cur{background:var(--accent-soft-2);}
.q-stem{font-size:20px;font-weight:620;line-height:1.4;letter-spacing:-.015em;margin:6px 0 22px;}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 18px;border:1.5px solid var(--hairline-strong);border-radius:var(--r-md);background:#fff;cursor:pointer;font-size:15.5px;font-weight:500;margin-bottom:11px;transition:all .12s;color:var(--ink);}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);}
.opt .key{width:27px;height:27px;border-radius:8px;background:var(--bg-sunken);display:grid;place-items:center;font-size:13px;font-weight:680;flex:0 0 auto;color:var(--ink-2);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.correct .key{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft);}
.opt.wrong .key{background:var(--rose);color:#fff;}
.opt.dim{opacity:.55;}
.opt:disabled{cursor:default;}
.explain{background:var(--accent-soft);border-radius:var(--r-md);padding:15px 18px;margin-top:6px;font-size:14.5px;line-height:1.55;color:var(--ink-2);border:1px solid var(--accent-soft-2);}
.explain b{color:var(--accent-ink);}
.score-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0;}
.fc-stage{max-width:600px;margin:0 auto;perspective:1600px;}
.flashcard{position:relative;width:100%;min-height:320px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.flashcard.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-xl);padding:34px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow-md);border:1px solid var(--hairline);}
.fc-front{background:#fff;}
.fc-back{background:linear-gradient(165deg,#f4f8ff,#eef3ff);transform:rotateY(180deg);}
.fc-face .fc-kicker{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-ink);margin-bottom:16px;}
.fc-front .fc-text{font-size:25px;font-weight:640;letter-spacing:-.02em;line-height:1.3;}
.fc-back .fc-text{font-size:18px;line-height:1.6;color:var(--ink-2);font-weight:480;}
.fc-back .fc-text b{color:var(--ink);}
.fc-hint{position:absolute;bottom:18px;font-size:12.5px;color:var(--ink-4);}
.fc-rate{display:flex;gap:10px;justify-content:center;margin-top:22px;}
.fc-rate button{flex:1;max-width:150px;padding:13px;border-radius:var(--r-md);border:1px solid var(--hairline-strong);background:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.fc-rate .again{color:var(--rose);border-color:var(--rose-soft);}.fc-rate .again:hover{background:var(--rose-soft);}
.fc-rate .hard{color:var(--amber);}.fc-rate .hard:hover{background:var(--amber-soft);}
.fc-rate .good{color:#1d7a47;}.fc-rate .good:hover{background:var(--green-soft);}
.fc-rate .easy{color:var(--accent-ink);}.fc-rate .easy:hover{background:var(--accent-soft);}
.searchbox{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--hairline-strong);border-radius:var(--r-pill);padding:12px 20px;box-shadow:var(--shadow-sm);}
.searchbox input{border:none;outline:none;font-size:16px;flex:1;background:none;color:var(--ink);}
.searchbox input::placeholder{color:var(--ink-4);}
.sresult{display:flex;gap:14px;padding:14px 16px;border-radius:var(--r-md);cursor:pointer;align-items:flex-start;}
.sresult:hover{background:var(--bg-sunken);}
.sresult .stype{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:var(--r-pill);flex:0 0 auto;margin-top:2px;}
.sresult .stitle{font-weight:600;font-size:15px;}
.sresult .ssnip{font-size:13.5px;color:var(--ink-3);margin-top:2px;line-height:1.5;}
.sresult mark{background:#fdeeb8;color:inherit;border-radius:3px;padding:0 2px;}
.review-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:15px 18px;}
.priority-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:var(--r-pill);}
.priority-tag.high{background:var(--rose-soft);color:#b8324b;}
.priority-tag.med{background:var(--amber-soft);color:#9a630f;}
.priority-tag.low{background:var(--slate-soft);color:var(--slate);}
.reason-list{font-size:13px;color:var(--ink-3);margin-top:3px;}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3);}
.empty .ei{font-size:46px;margin-bottom:14px;}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:6px;}
details.card>summary{list-style:none;cursor:pointer;padding:18px 22px;border-radius:var(--r-lg);}
details.card>summary::-webkit-details-marker{display:none;}
details.card>summary:hover{background:var(--bg-sunken);}
details.card[open]>summary{border-bottom:1px solid var(--hairline);border-radius:var(--r-lg) var(--r-lg) 0 0;}
.prob-summary .chip{flex:0 0 auto;}
.verbatim-box{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2);background:var(--bg-sunken);border-radius:12px;padding:14px 16px;max-height:460px;overflow:auto;border-left:3px solid var(--hairline-strong);margin-top:6px;}
/* Lynlæring (mobil-først minispill) */
.lyn-wrap{max-width:540px;margin:0 auto;}
.lyn-hero{background:linear-gradient(135deg,#5b21b6 0%,#4338ca 50%,#2f6bff 130%);color:#fff;border-radius:var(--r-xl);padding:22px 22px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.lyn-hero:after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);}
.lyn-streak{text-align:center;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 16px;min-width:74px;}
.lyn-streak .fl{font-size:20px;}
.lyn-streak .n{font-size:22px;font-weight:800;line-height:1.1;}
.lyn-streak .l{font-size:10.5px;opacity:.85;}
.lyn-cta{margin-top:14px;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6f9bff);color:#fff;border:none;transition:transform .1s;}
.lyn-cta:active{transform:scale(.985);}
.lyn-cta.done{background:var(--green-soft);color:var(--ink);}
.lyn-cta-emoji{font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.16);border-radius:14px;flex:0 0 auto;}
.lyn-cta.done .lyn-cta-emoji{background:#fff;}
.lyn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.lyn-tile{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:16px 14px;text-align:left;cursor:pointer;transition:transform .1s,box-shadow .15s;display:flex;flex-direction:column;gap:3px;}
.lyn-tile:hover{box-shadow:var(--shadow-md);}
.lyn-tile:active{transform:scale(.97);}
.lyn-tile:disabled{opacity:.45;cursor:default;}
.lyn-tile .em{font-size:24px;}
.lyn-tile .nm{font-weight:680;font-size:14.5px;letter-spacing:-.01em;}
.lyn-tile .ds{font-size:12px;color:var(--ink-3);}
/* Modellstrukturen tegnes som et tre, ikke en punktliste. Poenget med drillen
   er å bygge en nedbrytning — da må fasiten vise en nedbrytning. Loddrett stamme
   så det også holder på 277 px. */
.tre{margin:10px 0 0;}
.tre-rot{background:var(--accent-soft);border:1px solid var(--accent-soft-2);border-radius:var(--r-md);padding:10px 13px;font-weight:620;font-size:14px;line-height:1.45;color:var(--accent-ink);}
.tre-stamme{margin-left:13px;padding-left:16px;border-left:2px solid var(--accent-soft-2);padding-top:4px;}
.tre-gren{position:relative;padding:7px 0 7px 14px;}
.tre-gren:before{content:"";position:absolute;left:-16px;top:17px;width:14px;height:2px;background:var(--accent-soft-2);}
.tre-etikett{font-weight:620;font-size:14px;line-height:1.4;}
.tre-detalj{font-size:13px;line-height:1.5;color:var(--ink-3);margin-top:2px;}
.tre-slutt{margin:12px 0 0 13px;padding-left:16px;border-left:2px solid transparent;}
.lyn-game{min-height:280px;}
.lyn-prog{display:flex;gap:4px;margin-bottom:12px;}
.lyn-prog span{flex:1;height:4px;border-radius:99px;background:var(--bg-sunken);}
.lyn-prog span.done{background:var(--accent);}
.lyn-prog span.cur{background:var(--accent-soft-2);}
.lyn-timer{height:6px;border-radius:999px;background:var(--bg-sunken);overflow:hidden;margin:2px 0 10px;}
.lyn-timer span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--rose));border-radius:999px;transition:width .1s linear;}
.lyn-q{font-size:18.5px;font-weight:640;line-height:1.35;margin:6px 0 16px;letter-spacing:-.01em;}
.lyn-combo{color:var(--amber);font-weight:750;font-size:13px;margin:-8px 0 10px;}
.lyn-statement{font-size:19px;font-weight:600;line-height:1.42;margin:14px 0 20px;min-height:80px;letter-spacing:-.01em;}
.lyn-big{display:flex;gap:12px;margin-top:6px;}
.lyn-big button{flex:1;padding:18px 10px;font-size:17px;font-weight:750;border-radius:16px;cursor:pointer;letter-spacing:.02em;background:#fff;transition:transform .08s;}
.lyn-big button:active{transform:scale(.96);}
.lyn-big button:disabled{opacity:.55;cursor:default;}
.lyn-sant{color:#1d7a47;border:2px solid var(--green);}
.lyn-sant:hover{background:var(--green-soft);}
.lyn-usant{color:#b8324b;border:2px solid var(--rose);}
.lyn-usant:hover{background:var(--rose-soft);}
.par-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px;}
.par-tile{min-height:66px;padding:8px 6px;border-radius:14px;border:1.5px solid var(--hairline-strong);background:#fff;font-size:12.5px;font-weight:580;cursor:pointer;display:grid;place-items:center;text-align:center;line-height:1.25;transition:all .12s;color:var(--ink);}
.par-tile.sel{border-color:var(--accent);background:var(--accent-soft);}
.par-tile.matched{border-color:var(--green);background:var(--green-soft);opacity:.55;pointer-events:none;}
.par-tile.bad{border-color:var(--rose);background:var(--rose-soft);animation:shake .3s;}
.par-tile.hidden-face{background:var(--accent-soft);border-color:var(--accent-soft-2);color:var(--accent-ink);font-size:20px;font-weight:800;}
.lyn-opp{color:#1d7a47;border:2px solid var(--green);}
.lyn-opp:hover{background:var(--green-soft);}
.lyn-ned{color:#b8324b;border:2px solid var(--rose);}
.lyn-ned:hover{background:var(--rose-soft);}
.chain-pool{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.chain-step{width:100%;text-align:left;padding:13px 15px;border-radius:13px;border:1.5px solid var(--hairline-strong);background:#fff;font-size:14px;font-weight:540;cursor:pointer;line-height:1.35;color:var(--ink);}
.chain-step:hover{border-color:var(--accent);background:var(--accent-soft);}
.chain-built{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
.chain-done{display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);border:1px solid #cdeed8;border-radius:12px;padding:9px 13px;font-size:13.5px;line-height:1.35;}
.chain-done .cnum2{font-weight:800;color:#1d7a47;flex:0 0 auto;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.lyn-bit{font-size:15px;line-height:1.6;color:var(--ink-2);}
.lyn-bit b,.lyn-bit strong{color:var(--ink);}
.lyn-xp-big{font-size:42px;font-weight:800;letter-spacing:-.03em;color:var(--accent-ink);}
.opt.mono span{font-family:var(--mono);font-size:13px;line-height:1.4;}
/* Dybdetrening (100 spørsmål, selvrettet) */
details.dyb-q{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);margin:11px 0;overflow:hidden;box-shadow:var(--shadow-sm);}
details.dyb-q.done{border-left:4px solid var(--green);}
details.dyb-q.again{border-left:4px solid var(--rose);}
.dyb-qh{list-style:none;cursor:pointer;padding:15px 18px;display:flex;gap:12px;align-items:flex-start;transition:background .12s;}
.dyb-qh::-webkit-details-marker{display:none;}
.dyb-qh:hover{background:var(--bg-sunken);}
.dyb-num{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:2px 8px;flex:0 0 auto;margin-top:2px;min-width:26px;text-align:center;}
.dyb-qt{flex:1;min-width:0;}
.dyb-qtext{font-size:15.5px;font-weight:540;line-height:1.42;}
.dyb-tags{margin-top:6px;}
.dyb-tags .tag{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--bg-sunken);border-radius:999px;padding:2px 9px;margin-right:6px;display:inline-block;}
.dyb-ans{display:none;padding:0 18px 18px;border-top:1px solid var(--hairline);}
details.dyb-q[open] .dyb-ans{display:block;}
.dyb-ansin{background:var(--green-soft);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:14px 17px;margin-top:14px;font-size:15px;line-height:1.6;color:var(--ink-2);}
.dyb-ansin b{color:#1d7a47;}
.dyb-self{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.dyb-self span{font-size:13px;color:var(--ink-3);margin-right:2px;}
button.dyb-sb{font-family:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;border:1.5px solid var(--hairline-strong);background:#fff;transition:.15s;}
button.dyb-sb.g{color:#1d7a47;border-color:#b9d3c2;}
button.dyb-sb.g:hover,button.dyb-sb.g.on{background:var(--green);color:#fff;border-color:var(--green);}
button.dyb-sb.r{color:#b8324b;border-color:#e3c2c2;}
button.dyb-sb.r:hover,button.dyb-sb.r.on{background:var(--rose);color:#fff;border-color:var(--rose);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:var(--r-pill);font-size:14px;font-weight:540;box-shadow:var(--shadow-lg);opacity:0;transition:all .3s;z-index:200;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
textarea{font-family:inherit;}
/* splash / loader */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;}
.splash-card{max-width:460px;text-align:center;padding:40px;}
.splash-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,var(--accent),#6f9bff);box-shadow:var(--shadow-accent);display:grid;place-items:center;color:#fff;font-weight:750;font-size:28px;margin:0 auto 22px;}
.spinner{width:34px;height:34px;border:3px solid var(--accent-soft-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:18px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.drop{border:2px dashed var(--hairline-strong);border-radius:var(--r-lg);padding:28px;margin-top:18px;background:#fff;transition:all .15s;}
.drop.over{border-color:var(--accent);background:var(--accent-soft);}

/* fag-velger */
.splash-card.wide{max-width:560px;text-align:left;}
.picker-brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
.picker-brand .pb-logo{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:linear-gradient(145deg,var(--accent),#6f9bff);box-shadow:var(--shadow-accent);display:grid;place-items:center;color:#fff;font-weight:750;font-size:14px;letter-spacing:-.02em;}
.picker-brand .pb-name{font-weight:670;font-size:15.5px;letter-spacing:-.02em;color:var(--ink);}
.picker-brand .pb-tag{font-size:12.5px;color:var(--ink-4);margin-top:1px;}
.picker-title{font-size:26px;font-weight:680;letter-spacing:-.02em;}
.picker-sub{color:var(--ink-3);font-size:14.5px;margin:8px 0 24px;}
.subject-list{display:flex;flex-direction:column;gap:12px;}
.subject-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--card);box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s,border-color .14s;}
.subject-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--sc);}
.subject-card .sc-logo{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--sc);display:grid;place-items:center;color:#fff;font-weight:750;font-size:18px;letter-spacing:-.03em;}
.subject-card .sc-text{flex:1;min-width:0;}
.subject-card .sc-name{font-weight:640;font-size:16px;letter-spacing:-.015em;color:var(--ink);}
.subject-card .sc-blurb{font-size:13px;color:var(--ink-3);line-height:1.45;margin-top:3px;}
.subject-card .sc-arrow{width:19px;height:19px;flex:0 0 auto;color:var(--ink-4);}
.picker-foot{display:flex;align-items:center;gap:12px;margin-top:22px;}

/* konto */
.foot-link{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:8px 2px 2px;font-size:12.5px;font-weight:560;color:var(--ink-3);}
.foot-link:hover{color:var(--accent-ink);}
.acct{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:10px 2px 2px;}
.acct .acct-dot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--ink-4);}
.acct.ok .acct-dot{background:var(--green);}
.acct.bad .acct-dot{background:var(--rose);}
.acct .acct-t{font-size:12.5px;font-weight:580;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
.acct .acct-s{font-size:11px;color:var(--ink-4);}
.acct:hover .acct-t{color:var(--accent-ink);}
.acct-head{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
.acct-avatar{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;}
.acct-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.acct-form{display:flex;flex-direction:column;gap:14px;margin-top:16px;max-width:380px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field-l{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.input{font:inherit;font-size:15px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--hairline-strong);background:var(--bg-elevated);color:var(--ink);width:100%;transition:border-color .14s,box-shadow .14s;}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.acct-msg{font-size:13.5px;line-height:1.5;color:var(--ink-3);padding:10px 12px;border-radius:var(--r-sm);background:var(--bg-sunken);}
.acct-msg.ok{background:var(--green-soft);color:#1e6b41;}
.acct-msg.bad{background:var(--rose-soft);color:#a32b45;}
.acct-links{display:flex;gap:16px;flex-wrap:wrap;}
.linkbtn{border:none;background:none;padding:0;cursor:pointer;font-size:13px;font-weight:560;color:var(--accent-ink);}
.linkbtn:hover{text-decoration:underline;}
.acct-steps{margin:12px 0 0;padding-left:20px;color:var(--ink-2);font-size:14.5px;line-height:1.7;}
.acct-steps code{font-family:var(--mono);font-size:12.5px;background:var(--bg-sunken);padding:1px 6px;border-radius:6px;}
/* På mobil klemmes kapitteltittelen til 56 px mens «Forstått»-knappene
   beholder full bredde. Flytt dem ned på egen linje i stedet. */
@media (max-width:560px){
  .chap-row{grid-template-columns:34px minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;}
  .chap-row>.row{grid-column:1 / -1;justify-content:flex-end;}
  /* Sidetoppen har tittel til venstre og knapper til høyre i samme flexrad.
     En lang kapitteltittel dyttet knappene ut av skjermen — la dem brekke
     ned på egen linje i stedet. */
  .page-head .row{flex-wrap:wrap;row-gap:10px;}
  .page-head h1{font-size:27px;}
  /* Chips som faktisk er knapper — filtre og trinnvelgere — var 24 px høye.
     Etikett-chips er div-er og treffes ikke av denne. */
  button.chip{padding-top:7px;padding-bottom:7px;}
}
@media (max-width:1080px){.article-wrap{grid-template-columns:1fr;}.article-toc{display:none;}.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:860px){
  .grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}
  .content{padding:20px 18px 110px;}
  .sidebar{display:none;}

/* ---- eksamenssett ---- */

.sol-panel{margin-top:14px;background:var(--green-soft);border:1px solid #cfe9d8;border-left:4px solid var(--green);border-radius:var(--r-md);padding:14px 18px;}
.sol-h{display:flex;align-items:center;gap:8px;font-weight:650;color:#1f7a46;margin-bottom:6px;}

.sol-panel .prose p:first-child{margin-top:0;}

.exam-clock{position:sticky;top:0;z-index:55;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 18px;margin-bottom:18px;box-shadow:var(--shadow-md);}
.exam-clock.done{background:var(--green);}
.exam-clock.over{background:var(--rose);}
.exam-clock .ec-l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}
.exam-clock .ec-t{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
@media (max-width:860px){.exam-clock .ec-t{font-size:20px;}}
/* ---- kapittelhenvisninger i pensumteksten ----
   Bakover: en stille kode. Framover: kode + tittel + «senere», siden leseren
   verken kan plassere kapitlet eller vet at det ligger foran ham. */
.prose a.kapref{border-bottom:none;font-weight:640;color:var(--accent-ink);white-space:nowrap;}
.prose a.kapref:hover{text-decoration:underline;}
.prose a.kapref.senere{display:inline-flex;align-items:baseline;gap:5px;background:var(--bg-sunken);border:1px solid var(--hairline-strong);border-radius:var(--r-sm);padding:0 7px;font-size:.9em;font-weight:400;max-width:100%;white-space:normal;}
.prose a.kapref.senere:hover{background:var(--accent-soft);border-color:var(--accent-soft-2);text-decoration:none;}
.prose a.kapref.senere .kr-kode{font-weight:660;color:var(--ink-3);flex:0 0 auto;}
.prose a.kapref.senere .kr-tittel{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;}
.prose a.kapref.senere .kr-flagg{flex:0 0 auto;font-size:.8em;font-weight:620;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4);border-left:1px solid var(--hairline-strong);padding-left:5px;}
@media (max-width:560px){.prose a.kapref.senere .kr-tittel{display:none;}
  .prose a.kapref.senere{gap:4px;}}
