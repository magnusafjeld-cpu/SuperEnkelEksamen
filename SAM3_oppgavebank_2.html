{"t":10,"lv":2,"q":"Et negativt tilbudssjokk (ō > 0) gjør at","o":["AD-kurven skifter innover, og produksjonen faller","AS-kurven skifter opp, og vi beveger oss langs AD","begge kurvene skifter innover samtidig i samme periode","ingenting skjer før i perioden etter selve sjokket"],"a":1,"w":["Etterspørselskurven berøres ikke av et tilbudssjokk.","Riktig — høyere π utløser høyere rente via MP-regelen, altså bevegelse langs AD.","Bare AS flytter seg.","Virkningen kommer umiddelbart i samme periode."],"s":"Dette er en av de vanligste feilene på eksamen. At produksjonen faller er resultatet av at sentralbanken hever renten når inflasjonen stiger — ikke av at etterspørselskurven har flyttet seg. Skriv gjerne eksplisitt «bevegelse langs AD» i svaret."},
{"t":10,"lv":2,"q":"Ved et negativt etterspørselssjokk vil inflasjon og produksjonsgap","o":["bevege seg i samme retning, begge ned","bevege seg i motsatt retning av hverandre","være tilnærmet uendret på kort sikt","bevege seg i samme retning, begge opp"],"a":0,"w":["Riktig — AD skifter inn, og vi beveger oss ned langs AS.","Motsatt bevegelse kjennetegner tilbudssjokk.","Begge påvirkes umiddelbart.","Et negativt sjokk trekker begge ned."],"s":"Dette er den enkleste måten å identifisere sjokktypen fra data: beveger π og Ỹ seg samme vei, er sjokket på etterspørselssiden; beveger de seg motsatt vei, er det på tilbudssiden. Stagflasjon er derfor en signatur på tilbudssjokk."},
{"t":10,"lv":2,"q":"Et midlertidig tilbudssjokk (ō > 0 i én periode) uten ny politikk gir","o":["permanent høyere inflasjon","gradvis tilbakevending til Ỹ = 0 og π = π̄","permanent negativt produksjonsgap","umiddelbar tilbakevending til likevekt"],"a":1,"w":["Inflasjonen vender tilbake til målet så lenge MP-regelen står ved lag.","Riktig — men prosessen tar flere perioder.","Gapet lukkes gradvis av seg selv.","Tilbakevendingen er treg, ikke umiddelbar."],"s":"Mekanismen: det negative gapet gjør inflasjonen litt lavere hver periode, π_{t−1} faller, AS skifter nedover, og økonomien glir tilbake langs AD. At det tar tid er nettopp grunnen til at sentralbanker likevel vurderer å reagere aktivt i stedet for bare å vente."},
{"t":10,"lv":2,"q":"En varig økning i ā gir på lang sikt","o":["permanent positivt produksjonsgap og uendret inflasjon","Ỹ tilbake til null, men permanent høyere inflasjon","permanent lavere inflasjon og uendret produksjonsgap","ingen varig endring i verken produksjon eller priser"],"a":1,"w":["AS klatrer opp til gapet er lukket.","Riktig — langsiktig nøytralitet: etterspørsel kjøper ikke permanent høyere produksjon.","Høyere etterspørsel gir høyere, ikke lavere, inflasjon.","Inflasjonsnivået er varig endret."],"s":"Forløpet: AD skifter ut, Ỹ blir positivt og π stiger. Høyere π_{t−1} løfter AS, banken hever renten langs den nye AD-kurven, og gapet lukkes. Vil myndighetene ha varig høyere produksjon, må potensielt BNP flyttes — altså tilbudssidepolitikk."},
{"t":10,"lv":2,"q":"Et finansielt sjokk med økt risikopåslag f̄ virker i modellen som","o":["et positivt tilbudssjokk","et negativt etterspørselssjokk","en endring i inflasjonsmålet","et skift i AS-kurven"],"a":1,"w":["Sjokket rammer etterspørselen, ikke kostnadssiden.","Riktig — AD blir Ỹ = ā − b̄f̄ − b̄m̄(π − π̄), altså et skift innover.","Målet π̄ er uendret.","AS berøres ikke direkte."],"s":"Påslaget driver en kile mellom styringsrenten og den renten husholdninger og bedrifter faktisk møter. Politikkimplikasjonen er at sentralbanken må kutte mer enn normalt for å oppnå samme stimulans — finanskrisen 2008 i én setning."},
{"t":10,"lv":2,"q":"Med v̄ = 0,5, π_{t−1} = 4 % og Ỹ_t = −2 %, hva blir π_t (uten tilbudssjokk)?","o":["2 %","3 %","4 %","5 %"],"a":1,"w":["Her er hele produksjonsgapet trukket fra uten å multiplisere med v̄.","Riktig — 4 + 0,5 × (−2) = 3.","Her er gapleddet oversett.","Fortegnet på gapleddet er snudd."],"s":"Legg merke til hvor lite som skjer på én periode: et gap på −2 % tar inflasjonen ned bare ett prosentpoeng. Det er derfor disinflasjon er kostbart og tar tid — og hvorfor offerraten er 1/v̄ = 2 her."},
{"t":10,"lv":3,"q":"Offerraten (sacrifice ratio) måler","o":["hvor mange prosentpoeng inflasjonen faller per prosent tapt BNP","hvor mye BNP som tapes per prosentpoeng lavere inflasjon","hvor mange arbeidsplasser som går tapt per renteøkning","hvor mye sentralbanken taper på å gjennomføre disinflasjon"],"a":1,"w":["Dette er forholdet snudd på hodet.","Riktig — og den er lik 1/v̄ i modellen.","Ledighet inngår via Okuns lov, men det er ikke definisjonen.","Offerraten er en samfunnsøkonomisk størrelse, ikke en regnskapspost."],"s":"Utled den fra AS: summerer du π_t − π_{t−1} = v̄Ỹ_t over alle periodene, får du Δπ = v̄ · ΣỸ. Med v̄ = 0,5 kreves et samlet gap på −2 for å ta inflasjonen ned ett prosentpoeng. Flat Phillips-kurve gjør disinflasjon dyrt."},
{"t":10,"lv":3,"q":"Hvorfor reduserer godt forankrede inflasjonsforventninger kostnaden ved disinflasjon?","o":["Fordi bedriftene senker prisene av hensyn til fellesskapet","Fordi π^e faller uten at et stort negativt gap er nødvendig","Fordi sentralbanken da kan sette renten godt under null","Fordi produksjonen da blir uavhengig av rentenivået"],"a":1,"w":["Lojalitet er ikke en mekanisme i modellen.","Riktig — troverdighet flytter AS uten at ledighet må gjøre jobben.","Nullrentegrensen er et annet tema.","Rentekanalen virker som før."],"s":"Med rent adaptive forventninger må inflasjonen «presses ut» gjennom ledig kapasitet. Med troverdig forankring justeres forventningene direkte. Volcker-disinflasjonen i USA var kostbar nettopp fordi troverdigheten måtte bygges opp underveis."},
{"t":10,"lv":2,"q":"Under adaptive forventninger skifter AS-kurven mellom periodene fordi","o":["v̄ endrer seg fra periode til periode i modellen","π_{t−1} oppdateres til forrige periodes faktiske inflasjon","ō settes til en ny verdi ved inngangen til hvert år","AD-kurven skifter og trekker AS-kurven med seg"],"a":1,"w":["v̄ er en strukturparameter som holdes fast.","Riktig — dagens inflasjon blir morgendagens skiftparameter.","Tilbudssjokk kommer og går, men er ikke mekanismen bak den løpende dynamikken.","AD-skift flytter oss langs AS, det skifter ikke AS."],"s":"Denne tregheten er hele grunnen til at modellen har dynamikk. Uten den ville økonomien hoppet direkte tilbake til likevekt etter ethvert sjokk, og det ville ikke eksistert noen avveining for sentralbanken."},
{"t":10,"lv":3,"q":"Ved et negativt tilbudssjokk står sentralbanken overfor en avveining. Hvorfor finnes ikke denne avveiningen ved etterspørselssjokk?","o":["Fordi etterspørselssjokk er langt mindre i størrelse","Fordi π og Ỹ da beveger seg i samme retning, ikke motsatt","Fordi etterspørselssjokk ikke påvirker inflasjonen i det hele tatt","Fordi rentekanalen ikke virker mot etterspørselssjokk"],"a":1,"w":["Størrelsen er ikke poenget; det er retningen.","Riktig — dette kalles gjerne «divine coincidence».","Etterspørselssjokk påvirker begge størrelser.","Rentekanalen er nettopp virksom mot etterspørselssjokk."],"s":"Ved et negativt etterspørselssjokk faller både π og Ỹ, og et rentekutt løser begge problemer samtidig. Ved et tilbudssjokk stiger π mens Ỹ faller, og banken må velge hvor mye av hvert onde den vil ta. Fleksibel inflasjonsmålstyring er nettopp et svar på dette."},
{"t":10,"lv":2,"q":"Hva gjør en høyere m̄ med AD-kurven?","o":["Skifter den utover","Roterer den slik at den blir flatere","Roterer den slik at den blir brattere","Ingenting"],"a":1,"w":["Skift krever endring i ā, f̄ eller π̄.","Riktig — helningen er −1/(b̄m̄), så stor m̄ gir liten tallverdi og flat kurve.","Bratt kurve svarer til liten m̄, altså en passiv sentralbank.","m̄ inngår i AD-uttrykket og påvirker helningen."],"s":"Tenk på ytterpunktene: m̄ → ∞ betyr at banken aldri tillater avvik fra π̄, altså en vannrett AD. m̄ = 0 betyr ingen reaksjon, altså vertikal AD ved Ỹ = ā. Flat AD gir stabil inflasjon og volatil produksjon; bratt AD det motsatte."},
{"t":10,"lv":2,"q":"En økning i inflasjonsmålet π̄ vil","o":["skifte AD utover","skifte AD innover","rotere AD","ikke påvirke AD"],"a":0,"w":["Riktig — ved gitt π tolererer banken nå avviket bedre og setter lavere rente.","Høyere mål gir mer, ikke mindre, etterspørsel ved gitt inflasjon.","π̄ påvirker kurvens plassering, ikke helningen.","π̄ står eksplisitt i AD-uttrykket."],"s":"Fra Ỹ = ā − b̄m̄(π − π̄) ser du at et høyere π̄ reduserer inflasjonsavviket ved gitt π og dermed hever etterspørselen. På lang sikt ender økonomien med Ỹ = 0 og inflasjon lik det nye målet."},
{"t":10,"lv":3,"q":"Stagflasjon i AS-AD-modellen kjennetegnes ved","o":["høy inflasjon og positivt produksjonsgap","høy inflasjon og negativt produksjonsgap","lav inflasjon og negativt produksjonsgap","lav inflasjon og positivt produksjonsgap"],"a":1,"w":["Dette er en vanlig høykonjunktur.","Riktig — signaturen på et negativt tilbudssjokk.","Dette er en vanlig etterspørselsdrevet resesjon.","Dette er en gunstig kombinasjon, typisk etter et positivt tilbudssjokk."],"s":"Oljesjokkene på 1970-tallet og energiprissjokket i 2022 er standardeksemplene. Poenget for politikken er at det ikke finnes noen kombinasjon av rente som løser begge problemer samtidig — banken må velge."},
{"t":10,"lv":3,"q":"En permanent økning i ō (varig høyere kostnadsnivå) uten politikkendring gir","o":["varig høyere inflasjon og varig negativt produksjonsgap","gradvis tilbakevending til det opprinnelige utgangspunktet","varig høyere produksjon og uendret prisvekst over tid","vedvarende deflasjon og et positivt produksjonsgap"],"a":0,"w":["Riktig — AS ligger permanent høyere, og likevekten flytter seg langs AD.","Tilbakevending forutsetter at sjokket er midlertidig.","Et negativt tilbudssjokk gir lavere produksjon, ikke høyere.","Kostnadsøkning gir prisvekst, ikke prisfall."],"s":"Sammenlign nøye med det midlertidige sjokket: der forsvinner ō etter én periode, og økonomien reparerer seg selv. Ved et permanent sjokk må sentralbanken velge om den vil akseptere høyere inflasjon eller ta kostnaden ved å presse den ned."},
{"t":10,"lv":2,"q":"Hva bestemmer helningen på AS-kurven i (Ỹ, π)-diagrammet?","o":["m̄","v̄","ā","r̄"],"a":1,"w":["m̄ hører til AD-siden.","Riktig — AS er π = π_{t−1} + v̄Ỹ + ō, så v̄ er helningen.","ā er en AD-parameter.","r̄ inngår ikke i noen av kurvene."],"s":"Stor v̄ betyr bratt AS: presset i økonomien slår raskt ut i priser, og disinflasjon blir billig (offerrate 1/v̄). Liten v̄ gir flat AS, altså en økonomi der inflasjonen reagerer tregt — dyr disinflasjon, men også mindre inflasjonsutslag ved høykonjunktur."},
{"t":11,"lv":1,"q":"Automatiske stabilisatorer virker ved at","o":["Stortinget vedtar krisepakker raskere enn ellers","skatteinntekter faller og trygder stiger av seg selv","sentralbanken kutter renten uten å vente på vedtak","bedriftene senker prisene når etterspørselen faller"],"a":1,"w":["Vedtak er per definisjon diskresjonær politikk.","Riktig — ingen nye vedtak kreves, virkningen ligger i systemet.","Dette er pengepolitikk, ikke finanspolitikk.","Prissetting er ikke offentlig politikk."],"s":"Fordelen er at de tre etterslepene i diskresjonær politikk unngås: å oppdage nedgangen, å vedta tiltaket og å iverksette det. I Norge er stabilisatorene sterke fordi offentlig sektor og overføringssystemet er store. I modellspråk gjør de ā mindre følsom for sjokk."},
{"t":11,"lv":2,"q":"Ekspansiv finanspolitikk virker i AS-AD-modellen ved at","o":["ā øker og AD skifter utover","v̄ øker og AS blir brattere","m̄ faller","r̄ stiger"],"a":0,"w":["Riktig — offentlig etterspørsel er en del av autonom etterspørsel.","Finanspolitikk endrer ikke Phillips-kurvens helning.","m̄ er sentralbankens reaksjonsparameter.","Den nøytrale renten bestemmes av strukturelle forhold."],"s":"Konklusjonen følger av den generelle analysen av et permanent ā-skift: kortsiktig høyere Ỹ og π, men over tid tilbake til Ỹ = 0 med varig høyere inflasjon — med mindre sentralbanken motvirker ved å heve renten."},
{"t":11,"lv":3,"q":"Hvorfor får finanspolitikken en større rolle når styringsrenten er nær null?","o":["Fordi finanspolitikk alltid virker sterkere enn renten","Fordi pengepolitikkens vanlige kanal er blokkert","Fordi inflasjonen da er høy og må dempes raskt","Fordi de automatiske stabilisatorene slutter å virke"],"a":1,"w":["I normale tider foretrekkes pengepolitikk, blant annet fordi den er raskere å justere.","Riktig — ved nullrentegrensen kan ikke MP-regelen levere den nødvendige stimulansen.","Ved nullrentegrensen er inflasjonen typisk lav eller negativ.","Stabilisatorene virker fortsatt, men er ikke nok alene."],"s":"Ved nullrentegrensen kan lavere inflasjon til og med heve realrenten og forsterke nedgangen. Da må etterspørselen løftes direkte gjennom ā, altså finanspolitikk — supplert med forventningsstyring og kvantitative lettelser."},
{"t":11,"lv":2,"q":"Hva er hovedforskjellen mellom faktisk og strukturell budsjettbalanse?","o":["Strukturell balanse er justert for konjunkturenes virkning","Faktisk balanse gjelder bare staten, ikke kommunene","Strukturell balanse måles i faste priser fra et basisår","De to begrepene måler nøyaktig det samme over tid"],"a":0,"w":["Riktig — den strukturelle balansen viser den underliggende innretningen av politikken.","Begge kan måles for staten samlet.","Skillet handler om konjunktur, ikke om prisjustering.","De skiller seg klart i en nedgangskonjunktur."],"s":"Uten justering ville et automatisk underskudd i en nedgangskonjunktur sett ut som ekspansiv politikk, selv om ingenting var vedtatt. Den strukturelle balansen er derfor målet man vurderer finanspolitikkens innretning etter — og som handlingsregelen er formulert i."},
{"t":11,"lv":2,"q":"Handlingsregelen sier at det over tid skal brukes","o":["4 % av fondets verdi, som var det opprinnelige anslaget","3 % av fondets verdi, altså forventet realavkastning","hele den løpende avkastningen av fondet hvert enkelt år","3 % av fastlands-BNP, uavhengig av fondets størrelse"],"a":1,"w":["Anslaget ble nedjustert fra 4 % i 2017.","Riktig — regelen knytter oljepengebruken til forventet realavkastning, ikke til løpende inntekter.","Da ville fondets realverdi bli tæret på over tid.","Regelen er knyttet til fondets størrelse, ikke til BNP."],"s":"Formålet er dobbelt: å skjerme fastlandsøkonomien fra svingninger i oljeprisen, og å fordele formuen mellom generasjoner. Regelen tillater samtidig avvik over konjunktursykelen, slik at finanspolitikken kan brukes til stabilisering."},
{"t":11,"lv":3,"q":"Hva er koordineringsutfordringen mellom finans- og pengepolitikk?","o":["At de to delene av politikken bygger på ulike modeller","At ekspansiv finanspolitikk tvinger fram høyere rente","At Finansdepartementet i praksis fastsetter styringsrenten","At pengepolitikken virker raskere enn finanspolitikken gjør"],"a":1,"w":["Begge tar utgangspunkt i samme rammeverk.","Riktig — de to virkemidlene kan i praksis nøytralisere hverandre.","Renten settes av Norges Bank.","Ulik hastighet er en reell forskjell, men ikke koordineringsproblemet i seg selv."],"s":"Med et troverdig inflasjonsmål vil en varig ā-økning i hovedsak gi høyere rente, ikke varig høyere produksjon. Det er også årsaken til at finanspolitikkens fortrinn er størst der pengepolitikken ikke virker — ved nullrentegrensen eller i en valutaunion."},
{"t":11,"lv":3,"q":"Hva avgjør om gjeld som andel av BNP er stabil over tid?","o":["Utelukkende størrelsen på det løpende budsjettunderskuddet","Forholdet mellom rente og BNP-vekst, samt primærbalansen","Utelukkende inflasjonen, siden den tærer på realverdien","Utelukkende rentenivået på statens utestående gjeld"],"a":1,"w":["Underskuddet er viktig, men vekstraten i nevneren er like avgjørende.","Riktig — er r lavere enn g, kan gjeldsandelen falle selv med et primærunderskudd.","Inflasjon påvirker nominell BNP-vekst, men er bare én del av bildet.","Renten alene sier ingenting uten sammenligning med veksten."],"s":"Dette er gjeldsdynamikken i kortform: gjeldsandelen vokser når r > g, med mindre primærbalansen er positiv nok. Det forklarer hvorfor svært høy gjeld har vært håndterbar i perioder med lave renter, og hvorfor renteoppgang endrer regnestykket raskt."},
{"t":11,"lv":2,"q":"Hvorfor kan ikke etterspørselspolitikk gi varig høyere produksjon?","o":["Fordi slik politikk er forbudt etter budsjettreglene","Fordi produksjonen på lang sikt bestemmes av tilbudssiden","Fordi renten uansett ligger fast på nullrentegrensen","Fordi inflasjonen er konstant uansett hva som gjøres"],"a":1,"w":["Ingen forbud finnes.","Riktig — AD-politikk stabiliserer rundt banen, den flytter ikke banen.","Renten varierer.","Inflasjonen endres nettopp av etterspørselspolitikk."],"s":"Dette er langsiktig nøytralitet, og det binder sammen kortsikts- og langsiktsdelen av kurset: potensielt BNP bestemmes av Solow og Romer, mens AS-AD forklarer svingninger rundt det. Vil man løfte nivået varig, må man endre ā i vekstmodellene — altså tilbudssiden."},
{"t":11,"lv":3,"q":"En regjering vil heve potensielt BNP. Hvilket tiltak er mest relevant?","o":["Midlertidig økt offentlig forbruk over statsbudsjettet","Kontantstøtte til husholdningene for å løfte konsumet","Tiltak som øker arbeidstilbud, kompetanse eller produktivitet","Rentekutt for å stimulere investeringene i næringslivet"],"a":2,"w":["Dette hever ā og virker på etterspørselssiden.","Dette er også en etterspørselsstimulans.","Riktig — bare tilbudssidetiltak flytter selve produksjonskapasiteten.","Rentesetting er pengepolitikk og virker på etterspørselen."],"s":"Merk at grensen ikke er skarp: offentlige investeringer i utdanning, infrastruktur og forskning virker som etterspørsel på kort sikt og som tilbudsside på lang sikt. Det er nettopp derfor slike tiltak ofte foretrekkes i krisepakker."},
{"t":12,"lv":2,"q":"I norsk konvensjon skrives den nominelle kronekursen som ε = NOK per euro. En sterkere krone innebærer da at","o":["ε stiger","ε faller","ε er uendret","ε blir negativ"],"a":1,"w":["Stigende ε betyr at det trengs flere kroner per euro, altså svakere krone.","Riktig — færre kroner per euro betyr at kronen er styrket.","Kursen endrer seg når kronen styrkes.","En valutakurs kan ikke være negativ."],"s":"Denne konvensjonen forvirrer mange, og sensorveiledningene understreker den eksplisitt. Skriv gjerne i besvarelsen hvilken konvensjon du bruker, og bruk ord i tillegg til symboler: «kronen styrker seg, altså ε faller»."},
{"t":12,"lv":2,"q":"Udekket renteparitet innebærer at høyere norsk rente enn utlandets","o":["gir forventet framtidig styrking av kronen","gir forventet framtidig svekkelse av kronen","ikke påvirker forventningene","gjør kronen verdiløs"],"a":1,"w":["Da ville investorer fått både høyere rente og valutagevinst, altså en arbitrasjemulighet.","Riktig — i − i* ≈ forventet depresiering.","Renteforskjellen prises inn i forventet kursbane.","Renteforskjeller påvirker nivået, ikke valutaens eksistens."],"s":"Betingelsen er en ikke-arbitrasjebetingelse: forventet avkastning må være lik på tvers av valutaer. Merk tidsdimensjonen — kronen styrker seg i dag, og det er nettopp fra det høyere nivået den forventes å svekke seg gradvis."},
{"t":12,"lv":2,"q":"Norges Bank hever styringsrenten, alt annet likt. Hva skjer med kronen umiddelbart?","o":["Den svekker seg","Den styrker seg","Ingenting","Den blir fast"],"a":1,"w":["Dette forveksler den umiddelbare virkningen med den forventede banen framover.","Riktig — høyere avkastning trekker kapital inn, og etterspørselen etter kroner øker.","Valutamarkedet reagerer raskt på renteendringer.","Norge har flytende kurs."],"s":"Sammenhold med forrige spørsmål: kronen hopper opp i dag, til et nivå der den forventede svekkelsen framover akkurat oppveier rentefordelen. Begge utsagn er riktige, men om ulike tidspunkter — det er dette som skaper forvirringen."},
{"t":12,"lv":2,"q":"En svakere krone påvirker norsk økonomi ved at","o":["importprisene faller og norsk eksport blir dyrere ute","importprisene stiger og norsk eksport blir mer konkurransedyktig","både import- og eksportprisene faller målt i kroner","ingenting endres i realøkonomien, bare i nominelle størrelser"],"a":1,"w":["Effektene er snudd.","Riktig — derfor er kronen både en inflasjonskanal og en konkurranseevnekanal.","En svekkelse virker ulikt på import og eksport.","Realvalutakursen påvirker nettoeksporten."],"s":"For Norge, med høy importandel i konsumet, er gjennomslaget til KPI betydelig. Samtidig bedres konkurranseevnen for konkurranseutsatt sektor. Sentralbanken må veie disse mot hverandre: en svak krone stimulerer aktiviteten, men gjør inflasjonsmålet vanskeligere å nå."},
{"t":12,"lv":3,"q":"En renteøkning i utlandet, alt annet likt, vil for norsk økonomi virke som","o":["et negativt tilbudssjokk gjennom høyere importerte kostnader","et positivt etterspørselssjokk, fordi kronen svekkes","et negativt etterspørselssjokk gjennom svakere eksport","ingen effekt, siden Norge har flytende valutakurs"],"a":1,"w":["Sjokket kommer via etterspørselen, ikke via kostnadene.","Riktig — svakere krone gir real depresiering, bedre konkurranseevne og høyere ā_nx.","Fortegnet er snudd: svakere krone stimulerer eksporten.","For en liten åpen økonomi er utenlandsk rente et viktig eksogent sjokk."],"s":"Dette er poenget i AD-kurven for åpen økonomi: utenlandsk rente kommer inn som en ekstra skiftvariabel. Isolert sett gir høyere R* en real depresiering av kronen, økt nettoeksport og et positivt AD-skift — men i praksis følger utenlandsk rente ofte med et fall i utenlandsk etterspørsel, som trekker motsatt vei."},
{"t":12,"lv":3,"q":"Hva sier kjøpekraftsparitet (PPP)?","o":["At den nominelle valutakursen er konstant på lang sikt","At like varekurver på sikt bør koste det samme i felles valuta","At realrentene utjevnes mellom land gjennom kapitalstrømmer","At handelsbalansen mellom to land alltid går i null"],"a":1,"w":["Nominelle kurser svinger betydelig.","Riktig — realvalutakursen skal på lang sikt trekke mot et konstant nivå.","Dette er renteparitet, en annen betingelse.","Handelsbalansen kan være vedvarende i ubalanse."],"s":"PPP holder dårlig på kort sikt, men bedre over lange perioder. En kjent systematisk avvikelse er at prisnivået er høyere i rike land (Balassa-Samuelson), noe som gjør at enkle PPP-sammenligninger overvurderer levestandarden i fattige land om man ikke korrigerer."},
{"t":12,"lv":2,"q":"Norge har over tid hatt overskudd på handelsbalansen. Hovedårsaken er","o":["lave importpriser","petroleumseksporten","høy befolkningsvekst","lav sparerate"],"a":1,"w":["Importprisene forklarer ikke overskuddets størrelse.","Riktig — olje og gass gjør eksportverdien vedvarende høy.","Befolkningsvekst har ingen slik direkte effekt.","Norge har tvert imot høy nasjonal sparing."],"s":"Sett fra identiteten S − I = NX er overskuddet det samme som at Norge sparer mer enn det investerer innenlands, og plasserer differansen i utlandet gjennom fondet. Vare- og tjenestebalansen ser derimot langt mindre imponerende ut om man ser bort fra petroleum."},
{"t":12,"lv":2,"q":"En kraftig oljeprisøkning påvirker norsk økonomi ved at","o":["bare tilbudssiden rammes, som i et oljeimporterende land","både AS skifter opp og AD skifter ut samtidig","bare Fastlands-BNP påvirkes, og først etter flere år","ingenting skjer før oljeprisen faller tilbake igjen"],"a":1,"w":["Dette er analysen for et importland, ikke for Norge.","Riktig — Norge har en positiv etterspørselskanal som importland mangler.","Total-BNP påvirkes direkte og først.","Virkningene kommer umiddelbart via inntekter og forventninger."],"s":"Dette skillet er noe Doppelhofer trekker eksplisitt fram. Nettoeffekten på produksjonsgapet kan bli positiv samtidig som inflasjonen stiger — helt annerledes enn den rene stagflasjonen et importland opplever. Nevn alltid begge kanalene."},
{"t":12,"lv":2,"q":"Hvorfor slår en oljeprisøkning ulikt ut i total-BNP og Fastlands-BNP?","o":["Fordi Fastlands-BNP måles i andre priser enn total-BNP","Fordi fastlandsøkonomien påvirkes indirekte og med etterslep","Fordi Fastlands-BNP ikke påvirkes av oljeprisen i det hele tatt","Fordi total-BNP bare måles én gang i året, i motsetning til"],"a":1,"w":["Begge måles på samme måte.","Riktig — via oljeinvesteringer, leverandørindustri, sysselsetting og etter hvert oljepengebruk.","Fastlands-BNP påvirkes klart, men senere.","Begge publiseres kvartalsvis."],"s":"Merk også at BNP er et volummål: en prisøkning uten volumendring løfter først og fremst eksportverdien og nominelt BNP, ikke produsert mengde. Derfor er det inntekts- og investeringskanalen som betyr mest for realøkonomien i fastlandsøkonomien."},
{"t":12,"lv":2,"q":"Frontfagsmodellen innebærer at","o":["at staten fastsetter lønningene i alle sektorer samlet","at konkurranseutsatt industri forhandler først","at lønnsveksten følger konsumprisveksten helt mekanisk","at offentlig sektor forhandler først og setter normen"],"a":1,"w":["Lønnsdannelsen er partsstyrt, ikke statlig fastsatt.","Riktig — den sektoren som møter internasjonale priser, setter normen.","Lønnsveksten forhandles, ikke indekseres automatisk.","Frontfaget er industrien, ikke offentlig sektor."],"s":"Formålet er å sikre at samlet lønnsvekst er forenlig med konkurranseevnen. Modellen gjør også lønnsdannelsen mer forutsigbar for Norges Bank, noe som er en fordel i inflasjonsstyringen — men den utfordres når enkeltsektorer har svært ulik lønnsevne."},
{"t":12,"lv":2,"q":"Hva er betingelsen for bærekraftig reallønnsvekst over tid?","o":["At lønnsveksten er nøyaktig lik prisveksten hvert år","At lønnsveksten om lag følger produktivitetsveksten","At lønnsveksten ligger klart over produktivitetsveksten","At den nominelle lønnsveksten holdes helt nede på null"],"a":1,"w":["Da ville reallønnen stått stille.","Riktig — konstante lønnskostnader per enhet bevarer konkurranseevnen.","Da presses marginene, eller kostnadene veltes over i prisene.","Dette ville gitt fallende reallønn ved positiv inflasjon."],"s":"Dette er den økonomiske kjernen i frontfagsmodellen. Et vedvarende gap mellom lønns- og produktivitetsvekst gir enten svekket lønnsomhet i konkurranseutsatt sektor eller høyere inflasjon — begge deler noe sentralbanken må forholde seg til."},
{"t":12,"lv":3,"q":"Hva menes med «hollandsk syke» i norsk sammenheng?","o":["At oljeinntekter styrker kronen og svekker konkurranseutsatt sektor","At oljeprisen svinger kraftig fra år til år i markedet","At Norge importerer langt mer enn landet klarer å eksportere","At oljefondet har blitt for stort til å forvaltes forsvarlig"],"a":0,"w":["Riktig — en realappresiering og en tosporsøkonomi som kan være vanskelig å reversere.","Prissvingninger er et annet problem, håndtert av handlingsregelen.","Importnivået er ikke kjernen i begrepet.","Fondets størrelse er i seg selv ikke sykdommen."],"s":"Bekymringen er at kompetanse og kapasitet i konkurranseutsatt sektor bygges ned, og at den er kostbar å bygge opp igjen når oljealderen ebber ut. Handlingsregelen og fondet er delvis utformet nettopp for å dempe denne mekanismen."},
{"t":12,"lv":3,"q":"Hvorfor er Norge sårbart for endringer i utenlandsk økonomi?","o":["Fordi Norge har bundet kronen til euroen i et fastkurssystem","Fordi eksport- og importandelene av BNP er svært høye","Fordi Norge mangler en selvstendig sentralbank med egen rente","Fordi Norge deltar i eurosonens felles pengepolitikk"],"a":1,"w":["Norge har flytende kurs, som faktisk demper sjokk utenfra.","Riktig — betydelig høyere åpenhet enn for eksempel USA.","Norges Bank er en selvstendig sentralbank.","Norge står utenfor eurosonen."],"s":"Høy åpenhet betyr at utenlandsk etterspørsel og priser slår kraftig inn i ā og i inflasjonen. Samtidig gir flytende kurs en støtdemper: faller etterspørselen ute, svekkes kronen og demper utslaget i nettoeksporten."},
{"t":12,"lv":3,"q":"Realvalutakursen måler","o":["antall kroner som må betales for én euro i markedet","prisen på utenlandske varer målt i norske varer","renteforskjellen mellom Norge og handelspartnerne","overskuddet på handelsbalansen målt i felles valuta"],"a":1,"w":["Dette er den nominelle kursen.","Riktig — det er realkursen som bestemmer konkurranseevnen.","Renteforskjellen inngår i renteparitet.","Handelsbalansen er et resultat, ikke et kursmål."],"s":"En real appresiering gjør norske varer dyrere relativt til utenlandske og svekker nettoeksporten. Det kan skje enten ved at kronen styrker seg nominelt, eller ved at norsk pris- og lønnsvekst overstiger handelspartnernes — den siste kanalen er den frontfagsmodellen skal beskytte mot."}
];
BANK.forEach((q,i)=>q.id=i);

/* ---------- lagring av fremgang ---------- */
const KEY='sam3_oppgavebank_v1';
const Store={
  data:{}, mode:'minne', _t:null,
  async init(){
    if(window.storage && window.storage.get){
      this.mode='sky';
      try{ const r=await window.storage.get(KEY); if(r && r.value) this.data=JSON.parse(r.value); }catch(e){}
      return;
    }
    try{
      localStorage.setItem('__probe','1'); localStorage.removeItem('__probe');
      this.mode='nettleser';
      const r=localStorage.getItem(KEY); if(r) this.data=JSON.parse(r);
    }catch(e){ this.mode='minne'; }
  },
  async _write(){
    const s=JSON.stringify(this.data);
    try{
      if(this.mode==='sky') await window.storage.set(KEY,s,false);
      else if(this.mode==='nettleser') localStorage.setItem(KEY,s);
    }catch(e){}
  },
  save(){ clearTimeout(this._t); this._t=setTimeout(()=>this._write(),350); },
  st(id){ return this.data[id] || {s:0,r:0,w:0,l:-1}; },
  rec(id,ok){
    const d=this.data[id] || (this.data[id]={s:0,r:0,w:0,l:-1});
    d.s++; ok?d.r++:d.w++; d.l=ok?1:0; this.save();
  },
  reset(){ this.data={}; this._write(); }
};
const S=id=>Store.st(id);

let sel=new Set(TOPICS.map((_,i)=>i)), lvSel=new Set([1,2,3]), mode='alle';
let queue=[], idx=0, ans=[], answered=false, order=[];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MODES=[['alle','Alle'],['feil','Bare feil sist'],['nye','Ikke prøvd ennå'],['svake','Feilet minst én gang']];

function base(){ return BANK.filter(q=>sel.has(q.t)&&lvSel.has(q.lv)); }
function byMode(m){
  return base().filter(q=>{ const d=S(q.id);
    if(m==='feil') return d.l===0;
    if(m==='nye') return d.s===0;
    if(m==='svake') return d.w>0;
    return true; });
}
function shuf(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(list){
  queue = list || shuf(byMode(mode).slice());
  if(!queue.length) return;
  idx=0; ans=[]; render();
}

function home(){
  document.onkeydown=null;
  const seen=BANK.filter(q=>S(q.id).s>0).length;
  const solid=BANK.filter(q=>S(q.id).l===1).length;
  const n=byMode(mode).length;
  const lagring = Store.mode==='minne'
    ? 'Fremgang lagres ikke i denne visningen — last ned filen og åpne den i nettleseren for å beholde den.'
    : 'Fremgangen lagres automatisk og hentes fram neste gang du åpner filen.';
  app.innerHTML=`
  <p class="eyebrow">SAM3 Makroøkonomi</p>
  <h1>Oppgavebank</h1>
  <p class="lede">${BANK.length} flervalgsoppgaver gjennom hele pensum. Hver oppgave forklarer både hvorfor riktig svar er riktig, og hvorfor akkurat ditt alternativ ikke holder.</p>
  <div class="card">
    <div class="prog">
      <div><span class="big">${seen}</span><span class="lbl">prøvd av ${BANK.length}</span></div>
      <div><span class="big">${solid}</span><span class="lbl">sitter nå</span></div>
      <div><span class="big">${BANK.filter(q=>S(q.id).l===0).length}</span><span class="lbl">feil sist</span></div>
    </div>
    <div class="bar" style="margin:14px 0 22px"><div style="width:${solid/BANK.length*100}%"></div></div>

    <p class="eyebrow" style="margin-bottom:2px">Utvalg</p>
    <div class="picks" id="mp"></div>
    <p class="eyebrow" style="margin:22px 0 2px">Tema</p>
    <div class="picks" id="tp"></div>
    <p class="eyebrow" style="margin:22px 0 2px">Nivå</p>
    <div class="picks" id="lp"></div>
    <div style="margin-top:26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap">
      <button class="primary" onclick="start()" ${n?'':'disabled'}>${n?'Start '+n+' oppgaver':'Ingen oppgaver i utvalget'}</button>
      <span class="hint">Svar med <span class="kbd">1</span>–<span class="kbd">4</span>, videre med <span class="kbd">↵</span></span>
    </div>
    <p class="hint" style="margin-top:18px">${lagring} <button class="link" onclick="if(confirm('Slette all lagret fremgang?')){Store.reset();home();}">Nullstill fremgang</button></p>
  </div>`;

  const mp=document.getElementById('mp');
  MODES.forEach(([k,lab])=>{
    const c=byMode(k).length;
    const b=document.createElement('button');
    b.className='pick'+(mode===k?' on':''); b.innerHTML=lab+'<span class="c">'+c+'</span>';
    b.onclick=()=>{mode=k; home();};
    mp.appendChild(b);
  });
  const tp=document.getElementById('tp');
  TOPICS.forEach((t,i)=>{
    const qs=BANK.filter(q=>q.t===i);
    const ok=qs.filter(q=>S(q.id).l===1).length;
    const b=document.createElement('button');
    b.className='pick'+(sel.has(i)?' on':'');
    b.innerHTML=esc(t)+'<span class="c">'+ok+'/'+qs.length+'</span>';
    b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i); home();};
    tp.appendChild(b);
  });
  const all=document.createElement('button');
  all.className='pick'; all.textContent = sel.size===TOPICS.length?'Fjern alle':'Velg alle';
  all.onclick=()=>{ sel = sel.size===TOPICS.length? new Set() : new Set(TOPICS.map((_,i)=>i)); home(); };
  tp.appendChild(all);
  const lp=document.getElementById('lp');
  [1,2,3].forEach(l=>{
    const c=BANK.filter(q=>q.lv===l).length;
    const b=document.createElement('button');
    b.className='pick'+(lvSel.has(l)?' on':''); b.innerHTML=LV[l]+'<span class="c">'+c+'</span>';
    b.onclick=()=>{ if(lvSel.has(l)){ if(lvSel.size>1) lvSel.delete(l); } else lvSel.add(l); home(); };
    lp.appendChild(b);
  });
}

function goBack(){ if(idx>0){ idx--; render(); } else home(); }
function quit(){ ans.filter(Boolean).length ? results() : home(); }

function render(){
  if(idx>=queue.length) return results();
  const q=queue[idx];
  const prev=ans[idx];
  answered=!!prev;
  order = prev ? prev.order.slice() : shuf([0,1,2,3].slice(0,q.o.length));
  const right=ans.filter(a=>a&&a.ok).length;
  const d=S(q.id);
  const hist = d.s? '<span class="hist">'+(d.l===1?'satt sist':'feil sist')+' · '+d.r+'/'+d.s+'</span>' : '';
  app.innerHTML=`
  <div class="nav">
    <button class="link" onclick="goBack()">← ${idx>0?'Forrige oppgave':'Tilbake til start'}</button>
    <button class="link" onclick="quit()">Avslutt økten</button>
  </div>
  <div class="bar"><div style="width:${idx/queue.length*100}%"></div></div>
  <div class="topline">
    <span><span class="tag${q.lv===3?' l3':''}">${LV[q.lv]}</span> &nbsp;${esc(TOPICS[q.t])} ${hist}</span>
    <span>${idx+1}/${queue.length} &nbsp;·&nbsp; ${right} riktig</span>
  </div>
  <div class="card">
    <div class="q">${q.q}</div>
    <div class="opts" id="o"></div>
    <div id="fb"></div>
  </div>`;
  const box=document.getElementById('o');
  order.forEach((orig,disp)=>{
    const b=document.createElement('button');
    b.className='opt'; b.id='o'+disp;
    b.innerHTML='<span class="n">'+(disp+1)+'</span><span>'+q.o[orig]+'</span>';
    b.onclick=()=>answer(disp);
    box.appendChild(b);
  });
  if(prev) show(prev.picked, true);
  document.onkeydown=e=>{
    if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
    else if(!answered && /^[1-4]$/.test(e.key)){ const n=+e.key-1; if(n<order.length) answer(n); }
    else if(answered && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){ e.preventDefault(); idx++; render(); }
  };
  window.scrollTo(0,0);
}

function answer(disp){
  if(answered) return; answered=true;
  const q=queue[idx], picked=order[disp];
  const ok=picked===q.a;
  ans[idx]={q, picked, ok, order:order.slice()};
  Store.rec(q.id, ok);
  show(picked, false);
}

function show(picked, revisit){
  const q=queue[idx], ok=picked===q.a;
  const disp=order.indexOf(picked), rightDisp=order.indexOf(q.a);
  order.forEach((orig,j)=>{
    const el=document.getElementById('o'+j); el.disabled=true;
    if(j===rightDisp) el.classList.add('right');
    else if(j===disp) el.classList.add('wrong');
  });
  document.getElementById('fb').innerHTML=`
    <div class="fb">
      ${ok?'':`<div class="row lno"><span class="label">Ditt svar — ${esc(q.o[picked])}</span>${q.w[picked]}</div>`}
      <div class="row lok"><span class="label">${ok?'Riktig':'Riktig svar'} — ${esc(q.o[q.a])}</span>${q.w[q.a]}</div>
      <div class="sol"><span class="label">Løsningsforslag</span>${q.s}</div>
      <div class="next">
        <button class="primary" onclick="idx++;render()">${idx+1<queue.length?'Neste oppgave':'Se resultat'}</button>
        <span class="hint"><span class="kbd">↵</span></span>
      </div>
    </div>`;
  if(!revisit) document.querySelector('.fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function results(){
  document.onkeydown=null;
  Store._write();
  const log=ans.filter(Boolean);
  const right=log.filter(l=>l.ok).length, tot=log.length;
  const miss=log.filter(l=>!l.ok);
  const byT={};
  log.forEach(l=>{ const t=l.q.t; byT[t]=byT[t]||{ok:0,tot:0}; byT[t].tot++; if(l.ok) byT[t].ok++; });
  const rows=Object.keys(byT).map(Number).sort((a,b)=>(byT[a].ok/byT[a].tot)-(byT[b].ok/byT[b].tot)).map(t=>{
    const s=byT[t], p=Math.round(s.ok/s.tot*100);
    return `<tr><td>${esc(TOPICS[t])}</td>
      <td style="width:130px"><div class="track"><i class="t-ok" style="width:${p}%"></i><i class="t-no" style="width:${100-p}%"></i></div></td>
      <td class="num">${s.ok}/${s.tot}</td></tr>`;
  }).join('');
  const rev=miss.map(l=>`<div class="rev">
      <div class="rq">${l.q.q}</div>
      <div class="ra"><span style="color:var(--no)">Du svarte:</span> ${esc(l.q.o[l.picked])} &nbsp;·&nbsp; <span style="color:var(--ok)">Riktig:</span> ${esc(l.q.o[l.q.a])}</div>
      <div class="sol" style="margin-top:9px">${l.q.s}</div></div>`).join('');
  const solid=BANK.filter(q=>S(q.id).l===1).length;
  app.innerHTML=`
    <p class="eyebrow">Resultat</p>
    <h1>${right} av ${tot} riktig</h1>
    <div class="card">
      <p class="score-big">${tot?Math.round(right/tot*100):0} %</p>
      <table>${rows}</table>
      <p class="muted" style="font-size:14.5px;margin:0">Totalt sitter nå ${solid} av ${BANK.length} oppgaver. Under 70 % på et tema bør gjennomgås før du går videre.</p>
    </div>
    ${miss.length?`<h2>Oppgavene du bommet på</h2><div class="card">${rev}</div>`:'<h2>Ingen feil</h2><p>Utvid utvalget eller slå på A-nivå for å presse deg videre.</p>'}
    <div style="margin-top:26px; display:flex; gap:10px; flex-wrap:wrap">
      ${miss.length?`<button class="primary" onclick="start(RETRY)">Ta bommene på nytt (${miss.length})</button>`:''}
      <button class="ghost" onclick="idx=queue.length-1;render()">← Tilbake til siste oppgave</button>
      <button class="ghost" onclick="mode='feil';home()">Øv på alt jeg har feil på</button>
      <button class="ghost" onclick="home()">Tilbake til start</button>
    </div>`;
  window.RETRY=shuf(miss.map(l=>l.q));
  window.scrollTo(0,0);
