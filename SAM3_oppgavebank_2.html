<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAM3 – oppgavebank</title>
<style>
  :root{
    --bg:#FBFBF9; --surface:#FFFFFF; --ink:#16171A; --body:#2A2B30;
    --muted:#76777E; --line:#E7E7E2; --accent:#1F5468; --accent-soft:#EDF3F5;
    --ok:#2C6A4F; --ok-soft:#EBF3EE; --no:#94382F; --no-soft:#F8EEEC;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--body);
    font-family:"Iowan Old Style",Charter,Georgia,serif; font-size:17px; line-height:1.7;
    display:flex; justify-content:center; padding:48px 22px 100px;}
  .wrap{width:100%; max-width:720px}
  h1,h2,h3,.eyebrow,.label,th,button,.tag,.stat{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  h1{font-size:32px; line-height:1.2; font-weight:600; letter-spacing:-.02em; color:var(--ink); margin:0 0 12px}
  h2{font-size:21px; font-weight:600; color:var(--ink); margin:34px 0 10px; letter-spacing:-.01em}
  p{margin:0 0 15px}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .lede{font-size:18px; color:var(--body); margin-bottom:26px}
  .muted{color:var(--muted)}
  button{cursor:pointer; font-size:15px}
  .primary{background:var(--accent); color:#fff; border:none; border-radius:3px; padding:12px 24px; font-weight:500}
  .primary:hover{background:#173F4E}
  .primary:disabled{background:#B9C6CB; cursor:not-allowed}
  .ghost{background:none; border:1px solid var(--line); border-radius:3px; padding:9px 16px; color:var(--accent)}
  .ghost:hover{background:var(--accent-soft)}
  .tag{display:inline-block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
       padding:2px 7px; border-radius:2px; background:#F1F1EC; color:var(--muted); font-weight:600}
  .tag.l3{background:var(--accent-soft); color:var(--accent)}
  .bar{height:3px; background:var(--line); margin-bottom:20px; border-radius:2px; overflow:hidden}
  .bar>div{height:100%; background:var(--accent); width:0; transition:width .2s}
  .topline{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px;
           font-family:-apple-system,sans-serif; font-size:13px; color:var(--muted)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:26px}
  .q{font-size:19px; line-height:1.55; color:var(--ink); margin:6px 0 22px}
  .q .fx{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; background:#F3F3EF; padding:1px 5px; border-radius:2px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; background:#fff;
       border:1px solid var(--line); border-radius:3px; padding:13px 15px; font-size:16.5px;
       color:var(--body); font-family:inherit; line-height:1.5}
  .opt:hover:not(:disabled){border-color:var(--accent); background:#FCFDFD}
  .opt:disabled{cursor:default}
  .opt .n{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
          border-radius:2px; background:#F1F1EC; color:var(--muted); font-size:12px;
          font-family:ui-monospace,Menlo,monospace; margin-top:2px}
  .opt.right{border-color:var(--ok); background:var(--ok-soft)}
  .opt.right .n{background:var(--ok); color:#fff}
  .opt.wrong{border-color:var(--no); background:var(--no-soft)}
  .opt.wrong .n{background:var(--no); color:#fff}
  .fb{margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
  .fb .label{display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; margin-bottom:4px}
  .fb .lno .label{color:var(--no)} .fb .lok .label{color:var(--ok)}
  .fb .row{margin-bottom:14px; font-size:16px}
  .sol{background:var(--accent-soft); border-radius:3px; padding:14px 16px; font-size:16px}
  .sol .label{color:var(--accent)}
  .next{margin-top:20px; display:flex; justify-content:space-between; align-items:center; gap:12px}
  .hint{font-size:12.5px; color:var(--muted); font-family:-apple-system,sans-serif}
  .kbd{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; border:1px solid var(--line);
       border-radius:3px; padding:1px 5px; background:#F6F6F2; color:var(--muted)}
  .picks{display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 4px}
  .pick{border:1px solid var(--line); background:#fff; border-radius:3px; padding:7px 12px;
        font-size:13.5px; color:var(--body); font-family:-apple-system,sans-serif}
  .pick.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:500}
  .pick .c{color:var(--muted); font-size:12px; margin-left:5px}
  .pick.on .c{color:var(--accent)}
  table{width:100%; border-collapse:collapse; margin:18px 0; font-size:15px}
  th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;
     text-align:left; padding:0 8px 7px 0; border-bottom:1px solid var(--line)}
  td{padding:8px 8px 8px 0; border-bottom:1px solid var(--line)}
  td.num{font-family:ui-monospace,Menlo,monospace; text-align:right; font-size:14px}
  .track{height:14px; background:#F1F1EC; border-radius:2px; overflow:hidden; display:flex; min-width:90px}
  .track i{display:block; height:100%}
  .t-ok{background:var(--ok)} .t-no{background:var(--no)}
  .rev{border-top:1px solid var(--line); padding:16px 0}
  .rev:first-child{border-top:none}
  .rev .rq{font-size:16px; color:var(--ink); line-height:1.5}
  .rev .ra{font-size:14.5px; margin-top:5px}
  .score-big{font-size:42px; color:var(--accent); margin:0; font-family:-apple-system,sans-serif; font-weight:600}
  @media (max-width:600px){ body{padding:32px 16px 70px; font-size:16px} h1{font-size:26px} .q{font-size:18px} .card{padding:19px} }

  .prog{display:flex; gap:34px; flex-wrap:wrap}
  .prog>div{display:flex; flex-direction:column}
  .prog .big{font-family:-apple-system,sans-serif; font-size:30px; font-weight:600; color:var(--accent); line-height:1.15}
  .prog .lbl{font-family:-apple-system,sans-serif; font-size:12.5px; color:var(--muted)}
  .hist{font-family:-apple-system,sans-serif; font-size:11.5px; color:var(--muted);
        border:1px solid var(--line); border-radius:2px; padding:1px 7px; margin-left:6px}
  .link{background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer;
        font-family:-apple-system,sans-serif; padding:4px 0; text-decoration:none}
  .link:hover{text-decoration:underline}
  .nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .nav .link:last-child{color:var(--muted)}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const TOPICS = ["Nasjonalregnskap og måling","Vekstfakta og vekstrater","Produksjonsmodellen","Solow-modellen","Romer-modellen","Arbeidsmarkedet","Penger og inflasjon","Kort sikt: gap og potensial","IS-kurven","Pengepolitikk og MP","AS-AD-modellen","Finanspolitikk og myndighetene","Handel, valuta og Norge"];
const LV = ["","Kjerne","Eksamen","A-nivå"];
const BANK = [
{"t":0,"lv":1,"q":"Hva måler BNP mest presist?","o":["Verdien av alle transaksjoner som gjennomføres i økonomien i året","Markedsverdien av alle ferdigvarer og tjenester produsert innenlands","Verdien av all produksjon i økonomien, medregnet vareinnsats i hvert ledd","Verdien av alt som selges i økonomien i løpet av året, i markedspriser"],"a":1,"w":["Transaksjoner omfatter også bruktsalg og rene finansielle overføringer, som ikke er produksjon.","Riktig — fire nøkkelord: markedsverdi, ferdige varer, innenlands, i perioden.","Å telle vareinnsats gir dobbelttelling; derfor brukes bare merverdi eller sluttprodukter.","Produksjon og salg er ikke det samme: usolgte varer går på lager og teller likevel."],"s":"BNP er et produksjonsmål, ikke et transaksjons- eller salgsmål. Alternativt kan det måles som summen av merverdi i alle ledd, eller som summen av all inntekt — de tre måtene gir per definisjon samme tall."},
{"t":0,"lv":1,"q":"En bedrift produserer 100 sykler i år, men selger bare 80. Hvordan registreres de 20 usolgte i nasjonalregnskapet?","o":["De teller ikke før de blir solgt","Som lagerinvestering under I","Som offentlig konsum under G","Som negativ nettoeksport"],"a":1,"w":["Da ville BNP målt salg, ikke produksjon — og identiteten Y = C + I + G + NX ville brutt sammen.","Riktig — bedriften «kjøper varene av seg selv» og lagerendringen føres som investering.","G er offentlig sektors kjøp; en privat bedrifts lager har ingenting med G å gjøre.","Nettoeksport er eksport minus import; usolgte varer har ikke krysset noen grense."],"s":"Lagerendring er den posten som gjør at produksjonsidentiteten holder. Uplanlagt lageroppbygging er dessuten en tidlig konjunkturindikator: den betyr at etterspørselen ble svakere enn bedriftene ventet."},
{"t":0,"lv":1,"q":"Hvilken av disse inngår i årets BNP?","o":["Salg av en bruktbil mellom to privatpersoner","Meglerhonoraret ved salg av en 20 år gammel bolig","Kjøp av aksjer i Equinor","Utbetaling av alderspensjon"],"a":1,"w":["Bruktsalg er overføring av eksisterende formue, ikke ny produksjon.","Riktig — selve meglertjenesten er produsert i år og teller.","Aksjekjøp er en finansiell transaksjon, ikke produksjon av varer eller tjenester.","Pensjon er en overføring; det produseres ikke noe når pengene flyttes."],"s":"Regelen er: bare nyprodusert verdi i inneværende periode. Ved omsetning av brukte objekter teller bare den nye tjenesten som ytes i forbindelse med handelen."},
{"t":0,"lv":2,"q":"En norsk statsborger jobber hele året i Sverige. Hvor teller inntekten?","o":["I norsk BNP og norsk BNI","I svensk BNP og norsk BNI","I svensk BNP og svensk BNI","Verken i BNP eller BNI, siden det er grensekryssende"],"a":1,"w":["BNP er stedbundet: produksjonen skjer i Sverige.","Riktig — BNP måler produksjon innenfor landegrensene, BNI måler inntekt til landets innbyggere.","BNI følger personen, ikke stedet, så inntekten hører til norsk BNI.","Både BNP og BNI fanger opp inntekten, bare i hvert sitt land."],"s":"BNP = innenlands produksjon uansett hvem som eier eller utfører den. BNI = inntekt opptjent av landets innbyggere uansett hvor. Forskjellen er størst for land med mye utenlandsk eierskap eller mange utenlandspendlere."},
{"t":0,"lv":1,"q":"Nominelt BNP vokser med 6 %, og BNP-deflatoren vokser med 4 %. Hvor mye vokser realt BNP om lag?","o":["1,5 %","2 %","2,4 %","10 %"],"a":1,"w":["Du har trolig dividert i stedet for å trekke fra; forskjellen mellom 6/4 og 6−4 er ikke poenget her.","Riktig — nominelt BNP = P × Y, og vekstraten i et produkt er summen av vekstratene.","Dette ville vært svaret hvis vekstratene skulle multipliseres, men de adderes.","Vekstratene skal ikke summeres — det ville betydd at inflasjon skaper realvekst."],"s":"g(PY) = g(P) + g(Y), altså g(Y) = 6 − 4 = 2 %. Samme regel brukes overalt i kurset: vekstraten i et produkt er summen av vekstratene, i en brøk er den differansen."},
{"t":0,"lv":2,"q":"Hva er hovedforskjellen mellom KPI og BNP-deflatoren?","o":["KPI dekker bare mat og energi, mens deflatoren dekker hele økonomien","KPI dekker en fast konsumkurv med import, deflatoren innenlandsk produksjon","KPI oppdateres månedlig og deflatoren kvartalsvis, ellers er de like","KPI måler priser i butikk, deflatoren måler priser hos produsentene"],"a":1,"w":["KPI dekker hele husholdningenes konsumkurv, ikke bare mat.","Riktig — og det er nettopp derfor de kan sprike i en periode med svak krone eller høy oljepris.","Frekvensforskjellen finnes, men den er ikke den økonomisk viktige forskjellen.","De måler ulike varekurver og kan gi klart forskjellig prisvekst."],"s":"Importerte konsumvarer inngår i KPI, men ikke i deflatoren. Eksportvarer som olje inngår i deflatoren, men ikke i KPI. En kraftig svekket krone løfter derfor KPI mer enn deflatoren."},
{"t":0,"lv":2,"q":"KPI antas ofte å overvurdere den reelle veksten i levekostnader. Hvorfor?","o":["Fordi SSB bruker for få varer i kurven som måles","På grunn av substitusjons- og kvalitetsskjevhet","Fordi husleie og boligkostnader ikke er med i kurven","Fordi indeksen ikke justeres for sesongvariasjoner"],"a":1,"w":["Utvalgsstørrelsen er ikke hovedproblemet; skjevheten er systematisk og metodisk.","Riktig — forbrukere vrir konsumet mot det som er blitt relativt billigere, og kvalitetsforbedringer måles ufullstendig.","Boligkostnader inngår i KPI.","Sesongjustering er et teknisk spørsmål og ikke kilden til skjevheten."],"s":"Med en fast kurv fanges ikke opp at folk substituerer bort fra varer som blir dyre. I tillegg blir en prisøkning som følger av bedre kvalitet delvis feilaktig registrert som ren prisvekst. Sammen gir dette en skjevhet på typisk noen tideler."},
{"t":0,"lv":1,"q":"KPI steg fra 110 til 115,5 i løpet av et år. Hva var inflasjonen?","o":["5,5 %","5,0 %","4,8 %","11,0 %"],"a":1,"w":["5,5 er den absolutte endringen i indekspoeng, ikke prosentendringen.","Riktig — (115,5 − 110)/110 = 0,05.","Dette ville vært svaret om man delte på sluttverdien i stedet for startverdien.","Her er indeksverdien forvekslet med en prosentsats."],"s":"Inflasjon er alltid prosentvis endring i prisnivået, altså (P_t − P_{t−1})/P_{t−1}. Indekspoeng har ingen mening i seg selv — bare endringen relativt til utgangspunktet betyr noe."},
{"t":0,"lv":2,"q":"Hva er Fastlands-BNP?","o":["BNP fratrukket all eksport av varer og tjenester til utlandet","BNP unntatt petroleumsutvinning, rørtransport og utenriks sjøfart","BNP skapt utenfor Oslo og de største bykommunene i landet","BNP målt i faste priser i stedet for i løpende markedspriser"],"a":1,"w":["Eksport er en anvendelse av produksjonen, ikke en næring som trekkes ut.","Riktig — de tre næringene som er dominert av olje og skipsfart holdes utenfor.","Fastlands-BNP er ingen geografisk inndeling innad i Norge.","Faste priser gjelder skillet nominelt/realt, som er noe helt annet."],"s":"Fastlands-BNP er konjunkturmålet i Norge: det er der kapasitetsutnyttelsen, sysselsettingen og produksjonsgapet er relevante for rentesettingen. Total-BNP svinger med oljeproduksjon og -priser og sier mindre om presset i økonomien."},
{"t":0,"lv":2,"q":"Hvilken av disse regnes IKKE som investering i nasjonalregnskapet?","o":["En bedrift kjøper en ny maskin til produksjonen","En husholdning kjøper en nybygd bolig av utbygger","En husholdning kjøper aksjer for 100 000 kroner","En bedrift bygger opp varelager av usolgte varer"],"a":2,"w":["Maskiner er realkapital og er kjerneeksempelet på investering.","Boliginvesteringer inngår i I i nasjonalregnskapet.","Riktig — aksjekjøp er en finansiell plassering, ikke produksjon av ny realkapital.","Lagerendring er en egen investeringspost."],"s":"I makro betyr investering anskaffelse av ny realkapital, ikke finansiell sparing. Når du kjøper en aksje, bytter du bare eierskap til eksisterende kapital med noen andre — samlet realkapital i økonomien er uendret."},
{"t":0,"lv":2,"q":"I en lukket økonomi uten offentlig sektor gjelder at","o":["sparing alltid er større enn investering","sparing er lik investering","sparing er uavhengig av investering","investering finansieres av import"],"a":1,"w":["Da måtte noe av produksjonen forsvinne; identiteten tillater ikke dette.","Riktig — S = Y − C = I følger direkte av nasjonalregnskapsidentiteten.","De er knyttet sammen gjennom identiteten, ikke uavhengige.","Uten utenrikshandel finnes ingen import."],"s":"Med Y = C + I følger S = Y − C = I. I en åpen økonomi utvides dette til S − I = NX: et land som sparer mer enn det investerer, har handelsoverskudd og bygger opp fordringer på utlandet — som Norge."},
{"t":0,"lv":1,"q":"Fisher-ligningen sier at realrenten om lag er","o":["nominell rente pluss inflasjon","nominell rente minus inflasjon","nominell rente delt på inflasjon","nominell rente ganger prisnivået"],"a":1,"w":["Da ville høy inflasjon gjort det mer lønnsomt å spare, som er motsatt av virkeligheten.","Riktig — R ≈ i − π, altså avkastningen målt i kjøpekraft.","Renter og inflasjon er begge vekstrater og skal trekkes fra hverandre, ikke divideres.","Prisnivået inngår ikke; det er prisveksten som betyr noe."],"s":"Realrenten er prisen på å flytte kjøpekraft over tid, og det er den som styrer sparing og investering. Derfor står R og ikke i i IS-kurven. Skillet mellom ex ante (forventet inflasjon) og ex post (faktisk) er viktig når inflasjonen overrasker."},
{"t":0,"lv":3,"q":"Hvilket av følgende inngår IKKE i BNP, og er dermed en kjent svakhet ved målet?","o":["Offentlig produserte tjenester som skole og helse","Ulønnet husarbeid og omsorg i hjemmet","Bedriftenes eksport","Boligtjenester fra selveide boliger"],"a":1,"w":["Offentlige tjenester inngår, verdsatt til kostnadene ved å produsere dem.","Riktig — hjemmeproduksjon har ingen markedspris og faller utenfor.","Eksport er en del av BNP gjennom nettoeksporten.","Selveierboliger tilordnes en beregnet leieverdi som inngår i BNP."],"s":"BNP fanger ikke opp ulønnet arbeid, fritid, miljøkostnader eller fordeling. Et land der mye omsorgsarbeid flyttes fra hjemmet til markedet, får høyere BNP uten at det nødvendigvis produseres mer. Derfor er BNP per innbygger en indikator på materiell levestandard, ikke et velferdsmål."},
{"t":0,"lv":2,"q":"Realt BNP i Norge er 4 000 mrd. og nominelt BNP er 4 800 mrd. Hva er BNP-deflatoren?","o":["83","120","0,83","480"],"a":1,"w":["Her er brøken snudd; deflatoren har nominelt BNP i telleren.","Riktig — (4800/4000) × 100 = 120.","Riktig brøk, men deflatoren oppgis vanligvis som indeks med basisår = 100.","Dette er ingen meningsfull størrelse her."],"s":"Deflatoren = (nominelt BNP / realt BNP) × 100. En verdi på 120 betyr at prisnivået har steget 20 % siden basisåret. Vekstraten i deflatoren er inflasjonen målt over hele den innenlandske produksjonen."},
{"t":0,"lv":3,"q":"Norge har i mange år hatt store overskudd på driftsbalansen. Hva innebærer det i nasjonalregnskapsidentiteten?","o":["At investeringene innenlands overstiger nasjonal sparing","At sparingen overstiger investeringene innenlands","At offentlig sektor går med et vedvarende underskudd","At importen av varer overstiger eksporten hvert år"],"a":1,"w":["Da ville landet hatt underskudd og måttet låne fra utlandet.","Riktig — S − I = NX > 0, og differansen plasseres i utlandet, blant annet i oljefondet.","Norsk offentlig sektor har tvert imot hatt store overskudd.","Overskudd betyr at eksporten overstiger importen."],"s":"S − I = NX er den samme identiteten sett fra finanssiden: sparer et land mer enn det investerer hjemme, må overskuddet plasseres ute. For Norge er dette oljeinntekter som konverteres til fordringer på utlandet gjennom fondet."},
{"t":1,"lv":1,"q":"BNP per innbygger vokser med 3,5 % i året. Omtrent hvor lang tid tar det før nivået er doblet?","o":["10 år","20 år","35 år","70 år"],"a":1,"w":["Det ville krevd om lag 7 % årlig vekst.","Riktig — regelen om 70: 70/3,5 = 20 år.","Dette svarer til om lag 2 % vekst.","70 er tallet i telleren, ikke svaret."],"s":"Doblingstid ≈ 70 / vekstrate i prosent. Regelen følger av at ln(2) ≈ 0,70. Den er nyttig for å se hvor dramatisk små forskjeller i vekstrate er over tid: 1 % gir dobling på 70 år, 4 % på under 18."},
{"t":1,"lv":1,"q":"Hvorfor tegner vi ofte BNP per innbygger med logaritmisk y-akse?","o":["Fordi tallene ellers blir uhåndterlig store i moderne økonomier","Fordi konstant vekstrate da blir en rett linje med helning lik veksten","Fordi logaritmen fjerner virkningen av inflasjon fra tallseriene","Fordi det gjør det unødvendig å sammenligne nivåer mellom land"],"a":1,"w":["Aksens skala handler ikke om tallenes størrelse, men om hva helningen betyr.","Riktig — helningen i et log-diagram er vekstraten.","Inflasjonsjustering gjøres ved å bruke faste priser, ikke ved å ta logaritmen.","Log-skala gjør sammenligning enklere, ikke overflødig."],"s":"I log-skala tilsvarer like vertikale avstander like prosentvise endringer. En rett linje betyr konstant vekstrate, en brattere linje betyr høyere vekstrate, og et parallelt løft betyr en nivåeffekt. Dette er akkurat skillet du trenger for Solow og Romer."},
{"t":1,"lv":2,"q":"Y vokser med 4 % og befolkningen L med 1 %. Omtrent hvor mye vokser BNP per innbygger?","o":["5 %","4 %","3 %","0,25 %"],"a":2,"w":["Vekstrater i en brøk trekkes fra hverandre, ikke legges sammen.","Da har du sett bort fra befolkningsveksten helt.","Riktig — g(Y/L) = g(Y) − g(L) = 4 − 1.","Her er vekstratene dividert i stedet for subtrahert."],"s":"To regler dekker nesten alle vekstregnestykker i kurset: vekstraten i et produkt er summen av vekstratene, og vekstraten i en brøk er differansen. En tredje: vekstraten i x opphøyd i a er a ganger vekstraten i x."},
{"t":1,"lv":2,"q":"Et land har BNP per innbygger på 100 og vokser 2 % årlig. Hva er nivået etter 35 år?","o":["Om lag 170","Om lag 200","Om lag 270","Om lag 700"],"a":1,"w":["Dette undervurderer rentesrente-effekten.","Riktig — 70/2 = 35 år er doblingstiden, så nivået er om lag 200.","Dette svarer til nesten 3 % vekst over samme periode.","Her er vekstprosenten multiplisert med antall år, som ignorerer rentesrente."],"s":"Y_t = Y_0(1+g)^t. Poenget med eksponentiell vekst er at små forskjeller i g gir enorme forskjeller i nivå over generasjoner — det er grunnlaget for hele vekstlitteraturens interesse for vekstraten framfor nivået."},
{"t":1,"lv":2,"q":"Hva er det mest slående empiriske trekket ved BNP per innbygger i USA de siste hundre og femti årene?","o":["Vekstraten har steget jevnt gjennom hele perioden fram til i dag","Veksten har vært påfallende stabil rundt om lag 2 % i året","Veksten har vært tilnærmet null i alle år siden 1970-tallet","Nivået har svingt kraftig opp og ned uten noen tydelig trend"],"a":1,"w":["Vekstraten har vært bemerkelsesverdig stabil, ikke stigende.","Riktig — omtrent 2 % årlig over svært lang tid, tross kriger og kriser.","BNP per innbygger i USA har mer enn doblet seg flere ganger siden 1970.","Det finnes en tydelig og vedvarende oppadgående trend."],"s":"Denne stabiliteten er utgangspunktet for Romer-modellen: en modell for langsiktig vekst må kunne forklare vedvarende, tilnærmet konstant vekst — noe Solow-modellen med eksogen teknologi ikke gjør av seg selv."},
{"t":1,"lv":3,"q":"Hva menes med et «vekstmirakel» i vekstlitteraturen?","o":["Et land som ligger på et høyt BNP-nivå sammenlignet med naboene","Et land som over flere tiår vokser langt raskere enn de rikeste","Et land med usedvanlig høy befolkningsvekst over lang tid","Et land som ikke har opplevd noen resesjon på flere tiår"],"a":1,"w":["Nivå og vekstrate er to ulike ting — mange rike land vokser sakte.","Riktig — Sør-Korea, Japan og Kina er standardeksemplene.","Befolkningsvekst i seg selv sier lite om BNP per innbygger.","Fravær av konjunktursvingninger er ikke det samme som langsiktig vekst."],"s":"Vekstmirakler er sentrale fordi de viser at rask innhenting er mulig — konvergensprinsippet i praksis. Motstykket er land som har vokst saktere enn de rike og dermed sakket akterut, noe som viser at konvergens er betinget, ikke automatisk."},
{"t":1,"lv":2,"q":"Hva er vekstraten i variabelen x³ dersom x vokser med 2 %?","o":["2 %","3 %","6 %","8 %"],"a":2,"w":["Eksponenten multipliserer vekstraten.","Her er eksponenten forvekslet med vekstraten.","Riktig — vekstraten i x^a er a ganger vekstraten i x.","Dette ville vært nivåendringen om man regnet 1,02³ feil."],"s":"Denne regelen er nøkkelen i Romer: siden y = (1−ℓ̄)A^γ, blir g_y = γ · g_A. Den brukes også i Solow når man leser av at y* er proporsjonal med A opphøyd i 3/2."},
{"t":1,"lv":3,"q":"To land har samme vekstrate, men land A ligger permanent 40 % over land B i BNP per innbygger. I et log-diagram vil dette vises som","o":["to linjer med ulik helning","to parallelle linjer med vertikal avstand","to linjer som krysser hverandre","én linje, siden vekstratene er like"],"a":1,"w":["Ulik helning ville betydd ulike vekstrater.","Riktig — nivåforskjell gir konstant vertikal avstand, lik helning gir parallellitet.","Med lik vekstrate vil linjene aldri møtes.","Ulikt nivå gir to atskilte linjer."],"s":"Dette er den grafiske signaturen til en nivåeffekt, og den du må tegne når du svarer på hva en økning i spareraten eller i forskerandelen gjør. Skriv gjerne «samme helning» direkte på figuren."},
{"t":1,"lv":2,"q":"Konvergensprinsippet sier at","o":["alle fattige land vokser raskere enn de rike, uansett forutsetninger","et land vokser raskere jo lenger under sin egen bane det ligger","alle land til slutt havner på samme nivå på BNP per innbygger","vekstraten faller over tid i alle land, uavhengig av utgangspunkt"],"a":1,"w":["Konvergens er betinget: land med lav Ā konvergerer mot sitt eget lave nivå.","Riktig — avstanden til egen steady state, ikke til de rikeste, bestemmer veksthastigheten.","Ubetinget konvergens støttes ikke av dataene.","Vekstraten faller under overgangen mot steady state, men ikke universelt over tid."],"s":"Betinget konvergens forklarer hvorfor Japan og Sør-Korea vokste raskt etter krigen, mens mange lavinntektsland ikke gjør det: de siste ligger nær sin egen — lave — steady state, bestemt av sparerate, befolkningsvekst og særlig TFP."},
{"t":2,"lv":1,"q":"Produksjonsfunksjonen Y = Ā·K^(1/3)·L^(2/3) har","o":["økende skalaavkastning","konstant skalaavkastning","avtakende skalaavkastning","konstant avkastning på kapital alene"],"a":1,"w":["Det ville krevd at eksponentene summerte til mer enn 1.","Riktig — eksponentene summerer til 1, så dobling av både K og L dobler Y.","Det ville krevd sum under 1.","Avkastningen på kapital alene er avtakende, siden eksponenten er under 1."],"s":"Skill mellom skalaavkastning (alle faktorer samtidig) og avkastning på én faktor. Konstant skalaavkastning i objektene, kombinert med at ideer kan gjenbrukes gratis, er nettopp det som gir økende skalaavkastning samlet i Romer-modellen."},
{"t":2,"lv":2,"q":"Hva representerer eksponenten 1/3 på kapital i produksjonsfunksjonen?","o":["Kapitalens andel av samlet inntekt","Andelen av arbeidsstyrken som jobber med kapital","Avskrivningsraten","Sparerate i økonomien"],"a":0,"w":["Riktig — med frikonkurranse tilfaller αY kapitaleierne og (1−α)Y arbeidstakerne.","Eksponenten har ingenting med sysselsettingsfordeling å gjøre.","Avskrivningsraten er d̄ og inngår i kapitalakkumulasjonen, ikke i produksjonsfunksjonen.","Spareraten s̄ inngår i Solow-ligningen, ikke i eksponentene."],"s":"At α ≈ 1/3 er kalibrert fra data: lønnsandelen av BNP er om lag to tredeler i de fleste land og relativt stabil over tid. Dette gjør Cobb-Douglas-formen empirisk brukbar og gir modellen tallfestede prediksjoner."},
{"t":2,"lv":2,"q":"Produksjon per innbygger er y = Ā·k^(1/3). Hvis kapital per innbygger firedobles, hvor mye øker y?","o":["Firedobles","Om lag 1,6 ganger","Dobles","Øker med 33 %"],"a":1,"w":["Det ville krevd konstant avkastning på kapital alene.","Riktig — 4^(1/3) ≈ 1,59.","Dobling ville svart til eksponent 1/2.","33 % er eksponenten uttrykt i prosent, ikke effekten."],"s":"Dette er avtakende avkastning i tall. Konsekvensen er sentral: skal kapital alene forklare at Norge er 32 ganger rikere enn Madagaskar, måtte kapital per innbygger vært urimelig mye høyere. Derfor må mesteparten forklares av TFP."},
{"t":2,"lv":2,"q":"I utviklingsregnskapet er y_N/y_M ≈ 32, med et TFP-bidrag på om lag 8 og et kapitalbidrag på om lag 4. Hva er konklusjonen?","o":["Kapital forklarer mest av inntektsforskjellene","TFP forklarer om lag to tredeler av forskjellene","De to forklarer like mye","Modellen forklarer ingenting"],"a":1,"w":["Kapitalbidraget er det minste av de to.","Riktig — 8 × 4 = 32, og TFP-leddet står for om lag to tredeler av forskjellen målt i logaritmer.","Bidragene er klart ulike i størrelse.","Modellen dekomponerer forskjellen fullt ut; spørsmålet er hva A egentlig fanger opp."],"s":"Poenget som gjør resultatet utilfredsstillende: A er et restledd. Det fanger opp teknologi, men også institusjoner, ressursallokering, korrupsjon, humankapital og målefeil. Modellen flytter dermed spørsmålet fra «hvorfor er land fattige» til «hvorfor har land lav TFP»."},
{"t":2,"lv":3,"q":"Hvorfor er TFP enda viktigere i Solow-modellen enn i produksjonsmodellen?","o":["Fordi kapitalbeholdningen er eksogent gitt i Solow-modellen","Fordi A virker både direkte på y og indirekte ved å heve k*","Fordi Solow-modellen ser helt bort fra arbeidskraft som faktor","Fordi A vokser eksponentielt i Solow, men er konstant tidligere"],"a":1,"w":["Det er motsatt: kapital er endogen i Solow og eksogen i produksjonsmodellen.","Riktig — derfor er y* proporsjonal med A^(3/2) i Solow, mot A^1 i produksjonsmodellen.","Arbeidskraft inngår i begge modellene.","A er konstant i den enkle Solow-modellen, ikke voksende."],"s":"Høyere TFP gjør hver maskin mer produktiv, noe som gir mer produksjon direkte — men det øker også lønnsomheten av å akkumulere kapital, slik at k* stiger. Den doble virkningen forsterker TFPs rolle i å forklare inntektsforskjeller."},
{"t":2,"lv":2,"q":"I produksjonsmodellen (Jones kap. 4) er kapitalbeholdningen","o":["endogent bestemt av sparingen","eksogent gitt","alltid lik null","bestemt av befolkningsveksten"],"a":1,"w":["Endogenisering av K er nettopp det Solow-modellen tilfører.","Riktig — produksjonsmodellen tar K som gitt og spør hva den impliserer for y.","Kapital er positiv og sentral i modellen.","Befolkningsveksten kommer inn først i Solow med vekst i L."],"s":"Rekkefølgen i kurset er logisk: først spør vi hva en gitt mengde kapital og arbeidskraft gir av produksjon, deretter hvor kapitalen kommer fra (Solow), og til slutt hvor teknologien kommer fra (Romer). Hvert steg endogeniserer noe det forrige tok for gitt."},
{"t":3,"lv":1,"q":"Hvilke to ligninger utgjør kjernen i Solow-modellen?","o":["Produksjonsfunksjonen og kapitalakkumulasjonsligningen","IS-kurven for etterspørsel og MP-kurven for rentesetting","Idéproduksjonsfunksjonen og ressursbegrensningen for arbeid","Phillips-kurven for tilbudssiden og Okuns lov for ledighet"],"a":0,"w":["Riktig — Y = ĀK^αL^(1−α) og ΔK = s̄Y − d̄K.","Dette er kortsiktsmodellen.","Dette er Romer-modellen.","Dette er kortsiktsmodellens tilbudsside."],"s":"Hele Solow-modellen er disse to ligningene pluss antakelsen om at spareraten er konstant. All dynamikk kommer fra at investeringen s̄Y er konkav i K mens avskrivningen d̄K er lineær."},
{"t":3,"lv":1,"q":"Hva kjennetegner steady state i Solow-modellen?","o":["At produksjonen per innbygger er null i den nye likevekten","At investeringen akkurat dekker avskrivningen, slik at ΔK = 0","At spareraten har nådd sitt høyest mulige nivå i økonomien","At kapitalen vokser eksponentielt i takt med produksjonen"],"a":1,"w":["Produksjonen er tvert imot på sitt langsiktige nivå.","Riktig — s̄Y = d̄K gir ΔK = 0 og dermed konstant kapital og produksjon.","Spareraten er en gitt parameter, ikke noe som maksimeres i modellen.","Kapitalen er konstant i steady state."],"s":"Steady state er der de to kurvene i Solow-diagrammet krysser hverandre. Under k* er investeringen større enn avskrivningen og kapitalen vokser; over k* er det motsatt. Derfor er likevekten stabil."},
{"t":3,"lv":2,"q":"En varig økning i spareraten s̄ vil på lang sikt","o":["gi permanent høyere vekstrate i produksjon per innbygger","gi permanent høyere nivå på y, men uendret vekstrate","ikke ha noen virkning verken på nivå eller på vekstrate","gi permanent lavere nivå på y fordi konsumet reduseres"],"a":1,"w":["Vekstraten i steady state er null uansett hvilken sparerate økonomien har.","Riktig — nivåeffekt, med midlertidig høyere vekst i overgangsfasen.","Nivået på y* stiger tydelig.","Høyere sparing gir mer kapital, ikke mindre."],"s":"Mekanismen: mer sparing løfter investeringen over avskrivningen, kapitalen vokser, men avtakende avkastning gjør at gapet gradvis lukkes. Økonomien ender på en høyere, men flat, bane. I log-diagram: parallelt løft, ikke brattere linje."},
{"t":3,"lv":2,"q":"Med α = 1/3: hvor mye øker y* dersom spareraten dobles?","o":["Dobles","Med om lag 41 %","Firedobles","Med 33 %"],"a":1,"w":["Det ville krevd eksponent 1 på spareraten.","Riktig — y* er proporsjonal med s̄^(1/2), og √2 ≈ 1,41.","Firedobling ville krevd eksponent 2.","33 % blander sammen α og effekten."],"s":"y* = Ā^(3/2)·(s̄/d̄)^(1/2) når α = 1/3. Eksponenten α/(1−α) = 1/2 forteller at avkastningen på sparing er kraftig avtakende: dobler du sparingen, får du bare 41 % mer produksjon per innbygger på lang sikt."},
{"t":3,"lv":2,"q":"Solow-modellen med s̄ = 0,2, d̄ = 0,05, Ā = 1 og α = 1/3. Hva er y* i steady state?","o":["1","2","4","8"],"a":1,"w":["Dette ville svart til at kapitalbeholdningen var 1.","Riktig — k* = (s̄Ā/d̄)^(3/2) = 4^(3/2) = 8, og y* = Ā·k*^(1/3) = 2.","Her er forholdet s̄/d̄ forvekslet med y*.","8 er k*, ikke y*."],"s":"Regn alltid k* først, deretter y*. Kontroll: i steady state må s̄y* = d̄k*, altså 0,2 × 2 = 0,4 = 0,05 × 8. Stemmer. Denne kontrollen avslører regnefeil på sekunder."},
{"t":3,"lv":2,"q":"Hva skjer med y* dersom befolkningsveksten n̄ øker, i Solow-modellen med befolkningsvekst?","o":["y* stiger, fordi flere arbeidere gir større samlet produksjon","y* faller, fordi mer av investeringen går til de nye arbeiderne","y* er upåvirket, siden både Y og L vokser i samme takt","vekstraten i y stiger permanent når befolkningen vokser raskere"],"a":1,"w":["Total Y stiger, men produksjon per innbygger faller.","Riktig — kapitalfortynning: n̄ virker som en ekstra avskrivningsrate.","n̄ inngår direkte i uttrykket for y*.","Vekstraten i y per innbygger er fortsatt null i steady state."],"s":"Kapitalakkumulasjonen blir Δk = s̄y − (d̄ + n̄)k. Med raskere befolkningsvekst må mer av investeringen brukes bare for å holde kapital per innbygger konstant, så mindre blir igjen til å øke kapitaldybden. Total BNP vokser derimot i takt med befolkningen."},
{"t":3,"lv":2,"q":"En krig ødelegger halvparten av kapitalbeholdningen. Hva sier Solow-modellen om utviklingen etterpå?","o":["Landet havner permanent på et lavere nivå enn før krigen","Landet vokser raskt tilbake til den samme steady staten","Veksten blir null, fordi kapitalen som skal investeres mangler","Steady state faller til halvparten av det opprinnelige nivået"],"a":1,"w":["Steady state avhenger ikke av utgangsbeholdningen K₀.","Riktig — langt under k* er investeringen mye større enn avskrivningen, så veksten er høy.","Lav kapital gir høy marginalavkastning og dermed rask vekst, ikke stagnasjon.","Steady state bestemmes av s̄, d̄, n̄ og Ā, som alle er uendret."],"s":"Dette er transisjonsdynamikk i praksis, og forklarer den raske gjenoppbyggingen i Tyskland og Japan etter 1945. Merk forbeholdet: modellen forutsetter at Ā og institusjonene overlever krigen — det er dét som faktisk gjør prediksjonen troverdig."},
{"t":3,"lv":2,"q":"Når er vekstraten i BNP per innbygger høyest i Solow-modellen?","o":["Nær steady state","Langt under steady state","I steady state","Over steady state"],"a":1,"w":["Nær steady state er gapet mellom investering og avskrivning lite, og veksten nesten null.","Riktig — jo lengre under k*, desto større gap mellom s̄Y og d̄K.","I steady state er veksten per definisjon null.","Over steady state faller kapitalen, og veksten er negativ."],"s":"Vekstraten er proporsjonal med avstanden til steady state. Dette er selve motoren i konvergensprinsippet, og det er også grunnen til at vekstmirakler avtar etter hvert som landet nærmer seg de rikeste."},
{"t":3,"lv":3,"q":"Hvorfor kan ikke Solow-modellen forklare vedvarende vekst på lang sikt?","o":["Fordi modellen ser helt bort fra kapitalakkumulasjon","Fordi avtakende avkastning stopper veksten, og A er eksogen","Fordi den forutsetter at befolkningen er konstant over tid","Fordi modellen mangler en eksplisitt produksjonsfunksjon"],"a":1,"w":["Kapital er modellens kjerne.","Riktig — all langsiktig vekst må komme utenfra, gjennom Ā.","Modellen kan utvides med befolkningsvekst uten at konklusjonen endres.","Produksjonsfunksjonen er én av de to nøkkelligningene."],"s":"Modellen forklarer nivåforskjeller og konvergens svært godt, men vekst forutsettes snarere enn forklares. Nettopp denne mangelen motiverer Romer-modellen, der ideer produseres innenfor modellen og gir vedvarende vekst."},
{"t":3,"lv":3,"q":"Hvorfor er ikke en så høy sparerate som mulig nødvendigvis ønskelig?","o":["Fordi sparing over et visst nivå er forbudt ved lov","Fordi konsum er (1 − s̄)y, så svært høy sparing gir lite konsum","Fordi høy sparing gir lavere BNP per innbygger på lang sikt","Fordi kapitalen da slites ned raskere enn den bygges opp"],"a":1,"w":["Dette er ikke et økonomisk argument.","Riktig — målet er konsum over tid, ikke produksjon i seg selv.","Høy sparing gir høyere BNP på lang sikt.","Kapitalen øker, den forsvinner ikke."],"s":"Det finnes en avveining mellom konsum i dag og konsum i framtiden. En sparerate helt opp mot 1 ville gitt maksimal kapital, men nesten ingenting igjen å konsumere. Dette er den samme typen avveining som i Romer, der en ekstremt høy forskerandel gir mange ideer, men få varer."},
{"t":3,"lv":2,"q":"I Solow-diagrammet er investeringskurven s̄Y konkav og avskrivningslinjen d̄K rett. Hva følger av dette?","o":["Det finnes ingen likevekt med positiv kapitalbeholdning","Det finnes nøyaktig én positiv steady state, og den er stabil","Det finnes uendelig mange likevekter langs investeringskurven","Likevekten finnes, men er ustabil ved avvik i kapitalen"],"a":1,"w":["Kurvene krysser hverandre for en positiv K.","Riktig — konkav mot lineær gir én positiv skjæring, og pilene peker mot den fra begge sider.","Kun én positiv skjæring eksisterer med disse funksjonsformene.","Under k* vokser K og over k* faller K, altså stabilitet."],"s":"Stabiliteten er hele poenget: uansett hvor økonomien starter, ender den samme sted. Det gjør at spørsmål om engangssjokk i K (krig, naturkatastrofe) alltid har samme svar — tilbake til utgangspunktet."},
{"t":3,"lv":3,"q":"Et land har lav TFP og lav sparerate. Hva sier Solow-modellen om vekstutsiktene?","o":["Landet vil automatisk ta igjen de rike landene","Landet konvergerer mot sin egen, lave steady state","Landet vil vokse raskere enn rike land for alltid","Landet vil oppleve fallende BNP"],"a":1,"w":["Ubetinget konvergens gjelder ikke; steady state avhenger av parametrene.","Riktig — betinget konvergens: hvert land trekkes mot sitt eget nivå.","Rask vekst gjelder bare mens landet ligger under sin egen steady state.","BNP faller ikke, den stabiliserer seg på et lavt nivå."],"s":"Dette er svaret på hvorfor fattigdom kan være vedvarende. Politikkimplikasjonen er at tiltak må endre selve steady staten — særlig gjennom Ā, altså teknologi, institusjoner og ressursallokering — ikke bare gi et engangsløft i kapitalen."},
{"t":4,"lv":1,"q":"I Romer-modellen er den avgjørende nye antakelsen at","o":["at kapital har avtakende avkastning i produksjonen","at ideer er ikke-rivaliserende og produseres av forskere","at befolkningen holdes konstant gjennom hele perioden","at spareraten er eksogent gitt og konstant over tid"],"a":1,"w":["Dette er Solow-modellens antakelse.","Riktig — det er nettopp derfor modellen kan gi vedvarende vekst.","Modellen i kurset har befolkningsvekst n̄.","Sparing spiller ingen sentral rolle i den enkle Romer-modellen."],"s":"Ikke-rivalisering betyr at en idé kan brukes av alle samtidig uten å bli brukt opp. Kombinert med konstant skalaavkastning i objektene gir dette økende skalaavkastning samlet — grunnlaget for at veksten kan vare evig."},
{"t":4,"lv":2,"q":"Idéproduksjonen er ΔA_{t+1} = z̄·L_at, med L_at = ℓ̄·N_t. Hva blir vekstraten i ideer?","o":["z̄·ℓ̄, altså produktivitet ganger forskerandel","z̄·ℓ̄·N_t / A_t, altså strøm delt på nivå","z̄·A_t, altså produktivitet ganger kunnskap","ℓ̄·N_t, altså antallet forskere i økonomien"],"a":1,"w":["Dette er strømmen delt på befolkning, ikke på kunnskapsnivå.","Riktig — vekstraten er endringen delt på nivået, ΔA/A.","Dette har feil struktur; A står i nevneren, ikke telleren.","Dette er antall forskere, ikke en vekstrate."],"s":"Legg merke til strukturen: telleren vokser med befolkningen, nevneren med kunnskapsnivået. Skal brøken være konstant over tid, må A vokse i takt med N — og det er dette som låser g_A til n̄."},
{"t":4,"lv":2,"q":"Hva er den langsiktige vekstraten i produksjon per person i Romer-modellen med befolkningsvekst?","o":["z̄·ℓ̄·N̄","γ·n̄","γ·z̄","n̄ + ℓ̄"],"a":1,"w":["Dette er vekstraten i den forenklede varianten uten befolkningsvekst.","Riktig — g_A = n̄ langs den balanserte banen, og y = (1−ℓ̄)A^γ gir g_y = γ·n̄.","z̄ påvirker bare nivået, ikke vekstraten.","Parametrene kan ikke summeres slik; ℓ̄ er en andel."],"s":"Utledningen på fire linjer: (1) g_A = z̄ℓ̄N/A, (2) konstant brøk krever g_A = n̄, (3) y = (1−ℓ̄)A^γ, (4) g_y = γ·g_A = γn̄. Kan du dette, får du alle nivå- og vekstspørsmålene i Romer gratis."},
{"t":4,"lv":2,"q":"Myndighetene subsidierer forskning slik at forskerandelen ℓ̄ øker permanent. Hva skjer med produksjon per person på lang sikt?","o":["Vekstraten blir permanent høyere enn den var før tiltaket","Nivået på vekstbanen løftes, men vekstraten er uendret","Verken nivået eller vekstraten endres på lang sikt","Nivået faller, mens vekstraten blir liggende uendret"],"a":1,"w":["Vekstraten er fortsatt γn̄; ℓ̄ inngår ikke i den.","Riktig — nivåskift med midlertidig høyere vekst i overgangen.","Nivået på banen løftes tydelig.","Nivået stiger, med mindre ℓ̄ allerede er urimelig høy."],"s":"Mekanismen: flere forskere gir flere ideer per år, så g_A hopper opp. Men når A stiger, blir den samme årlige idéstrømmen en mindre prosentvis økning, og g_A glir tilbake til n̄. I figur: en kurve som bøyer opp og deretter blir parallell med den gamle banen."},
{"t":4,"lv":2,"q":"Hva skjer med langsiktig vekst dersom forskernes produktivitet z̄ øker varig?","o":["Vekstraten stiger permanent","Bare nivået på vekstbanen stiger","Vekstraten faller","Ingenting, verken nivå eller vekst"],"a":1,"w":["z̄ står i nivåkonstanten, ikke i vekstraten γn̄.","Riktig — samme logikk som for ℓ̄: nivåeffekt og midlertidig vekstøkning.","Høyere forskerproduktivitet er utvetydig positivt for nivået.","Nivået på banen løftes, så noe endres."],"s":"Fra A_t = (z̄ℓ̄/n̄)·N_t ser du at z̄ og ℓ̄ bare skalerer nivået på kunnskapsbanen. Tommelfingerregelen: står parameteren i konstanten foran, er det nivå; står den i eksponenten som virker på tid, er det vekst."},
{"t":4,"lv":2,"q":"Fruktbarheten faller i Norge, slik at n̄ synker varig. Hva sier Romer-modellen?","o":["Ingen effekt på langsiktig vekst","Langsiktig vekst i BNP per person faller permanent","Bare nivået faller","Veksten stiger, siden det blir mer kapital per person"],"a":1,"w":["n̄ inngår direkte i g_y = γn̄.","Riktig — færre mennesker gir færre framtidige forskere og dermed lavere idévekst.","Dette er en veksteffekt, ikke bare en nivåeffekt.","Kapital per person er Solow-logikk og endrer ikke den langsiktige vekstraten i Romer."],"s":"Dette er et eksamensspørsmål fra H25. Myndighetene kan motvirke fallet midlertidig ved å øke ℓ̄ eller z̄, men det gir bare nivåløft og en overgangsperiode med høyere vekst — ikke en varig høyere vekstrate."},
{"t":4,"lv":3,"q":"Hvorfor gir et marked med frikonkurranse for lite forskning?","o":["Fordi forskere er dyrere enn andre arbeidstakere","Fordi prisen presses mot grensekostnaden, som er nær null","Fordi ideer er rivaliserende og dermed vanskelige å dele","Fordi myndighetene i praksis begrenser privat forskning"],"a":1,"w":["Lønnsnivået er ikke kjernen i argumentet.","Riktig — ikke-rivalisering betyr at kopiering nesten ikke koster noe.","Ideer er nettopp ikke-rivaliserende; det er hele poenget.","Det finnes ikke noe slikt forbud."],"s":"Den faste kostnaden ved å utvikle en idé må dekkes av en pris over grensekostnad. Derfor trengs en form for markedsmakt eller støtte: patenter, opphavsrett, forskningssubsidier eller offentlig finansiert grunnforskning. Avveiningen er mellom insentiver til å skape og spredning av det som er skapt."},
{"t":4,"lv":3,"q":"Hva skjer dersom ℓ̄ settes ekstremt høyt, nær 1?","o":["Nivået på vekstbanen fortsetter å stige uten grense","Nivået kan falle, fordi få er igjen i vareproduksjon","Vekstraten går mot uendelig når ℓ̄ nærmer seg 1","Modellen bryter matematisk sammen ved høye verdier"],"a":1,"w":["Nivåkonstanten (1−ℓ̄)·ℓ̄^γ stiger først, men faller mot null når ℓ̄ nærmer seg 1.","Riktig — i ytterste konsekvens forskes det mye, men produseres ingenting.","Vekstraten er γn̄ uansett hvor stor ℓ̄ er.","Modellen er velfungerende; resultatet er en reell økonomisk avveining."],"s":"Nivået er proporsjonalt med (1−ℓ̄)·ℓ̄^γ, som maksimeres ved ℓ̄ = γ/(1+γ). Dette er avveiningen mellom å bruke mennesker på å lage ideer og på å lage varer — og et poeng sensorveiledningen eksplisitt trekker fram."},
{"t":4,"lv":2,"q":"Hva menes med at ideer er ikke-rivaliserende?","o":["At ingen kan gjøre krav på eierskap til en idé","At flere kan bruke samme idé samtidig uten at den brukes opp","At ideer er gratis å utvikle for den som kommer på dem","At en idé bare kan tas i bruk én gang av én aktør"],"a":1,"w":["Ideer kan gjøres delvis ekskluderbare gjennom patenter — eierskap er mulig.","Riktig — motsatt av et objekt, som bare én kan bruke om gangen.","Utviklingen er tvert imot dyr; det er bruken som er billig.","Dette beskriver et rivaliserende objekt."],"s":"Skill mellom rivalisering (kan flere bruke det samtidig?) og ekskluderbarhet (kan andre stenges ute?). Ideer er ikke-rivaliserende, men kan gjøres delvis ekskluderbare — og hele patentpolitikken handler om å balansere disse to."},
{"t":4,"lv":3,"q":"Hva er kilden til økende skalaavkastning i Romer-modellen?","o":["At kapital i denne modellen har økende avkastning i produksjonen","At ideen kan gjenbrukes gratis, i tillegg til konstant skalaavkastning","At befolkningen vokser med konstant rate og stadig blir større","At forskere er langt mer produktive enn andre arbeidstakere"],"a":1,"w":["Kapital har avtakende avkastning også her.","Riktig — dobler du innsatsen av objekter og legger til samme idémasse, blir produksjonen mer enn doblet.","Befolkningsvekst gir vedvarende vekst, men er ikke kilden til skalaegenskapen.","Forskere er ikke antatt mer produktive per person i vareproduksjon."],"s":"Økende skalaavkastning er grunnen til at frikonkurranse ikke kan være hele historien: med økende skalaavkastning kan ikke alle faktorer betales sin grenseproduktivitet uten at regnskapet går i minus. Derfor trengs markedsmakt eller subsidier."},
{"t":4,"lv":3,"q":"Hvorfor gir Romer-modellen en «skalaeffekt» som mange finner problematisk?","o":["Fordi flere mennesker gir mer idévekst, så store land burde vokst raskest","Fordi modellen forutsetter at alle land er omtrent like store i folketall","Fordi den ser helt bort fra kapital som produksjonsfaktor","Fordi den langsiktige vekstraten avhenger av spareraten"],"a":0,"w":["Riktig — og empirisk er sammenhengen mellom landstørrelse og vekstrate svak.","Modellen tar ikke stilling til at landene er like store.","Fraværet av kapital er en forenkling, men ikke det som kalles skalaeffekten.","Spareraten inngår ikke i Romer-modellens vekstrate."],"s":"En vanlig innvending og et godt drøftingspunkt: ideer flyter over landegrensene, så det relevante «markedet» for ideer er verden, ikke det enkelte land. Da er det verdens befolkningsvekst, ikke Norges, som er relevant for norsk teknologivekst."},
{"t":4,"lv":2,"q":"I den enkleste Romer-varianten UTEN befolkningsvekst er vekstraten g = z̄ℓ̄L̄. Hvorfor er det viktig å vite hvilken variant man ser på?","o":["Fordi svaret på om ℓ̄ påvirker vekstraten avhenger av varianten","Fordi bare den ene varianten inneholder produksjon av ideer","Fordi symbolet z̄ betyr helt ulike ting i de to variantene","Fordi den ene varianten mangler produksjonsfunksjon for varer"],"a":0,"w":["Riktig — uten befolkningsvekst påvirker ℓ̄ vekstraten, med befolkningsvekst gjør den det ikke.","Begge varianter bygger på idéproduksjon.","z̄ er forskernes produktivitet i begge.","Begge har en produksjonsfunksjon."],"s":"Sjekk alltid om n̄ er med i ligningssettet før du svarer. Kursets modell har befolkningsvekst, og da er g_y = γn̄ fasiten. Blandingen av de to variantene er en av de vanligste feilkildene på denne delen av pensum."},
{"t":5,"lv":1,"q":"Hvordan defineres arbeidsledighetsraten?","o":["Arbeidsledige delt på befolkningen","Arbeidsledige delt på arbeidsstyrken","Arbeidsledige delt på antall sysselsatte","Sysselsatte delt på befolkningen i arbeidsdyktig alder"],"a":1,"w":["Dette blander sammen ledighet og yrkesdeltakelse.","Riktig — arbeidsstyrken = sysselsatte + arbeidsledige.","Nevneren må inkludere de ledige selv.","Dette er sysselsettingsraten."],"s":"Å ikke ha jobb er ikke det samme som å være arbeidsledig: man må også søke aktivt for å være med i arbeidsstyrken. Derfor må ledighetsraten alltid leses sammen med yrkesdeltakelsen."},
{"t":5,"lv":2,"q":"En arbeidsledig gir opp jobbsøkingen og slutter å søke. Hva skjer med målt arbeidsledighet?","o":["Den stiger","Den faller","Den er uendret","Den blir udefinert"],"a":1,"w":["Personen fjernes fra telleren, så raten kan ikke stige.","Riktig — personen forlater arbeidsstyrken og telles verken som ledig eller sysselsatt.","Både teller og nevner endres, og raten faller.","Raten er fortsatt veldefinert."],"s":"Dette er «discouraged workers»-problemet: ledigheten kan falle uten at noen har fått jobb. I dype nedgangstider maskerer det svakhet i arbeidsmarkedet, og derfor følger man også med på sysselsettingsraten og yrkesdeltakelsen."},
{"t":5,"lv":2,"q":"I strømmemodellen (badekarmodellen) er den naturlige arbeidsledighetsraten gitt ved","o":["u* = s·f","u* = s/(s+f)","u* = f/(s+f)","u* = f − s"],"a":1,"w":["Produktet av ratene har ingen tolkning som en andel.","Riktig — separasjonsraten delt på summen av separasjons- og jobbfinnerate.","Dette gir andelen sysselsatte, ikke ledige.","Differansen kan bli negativ og gir ingen mening som en rate."],"s":"Intuisjonen er balanse i strømmene: i steady state må antallet som mister jobb være lik antallet som finner jobb. Sett s·(1−u) = f·u og løs — det gir formelen. Den viser at det bare finnes to måter å endre naturlig ledighet på: endre s eller endre f."},
{"t":5,"lv":2,"q":"100 000 er sysselsatt. Hver måned mister 2 % av de sysselsatte jobben, og 18 % av de ledige finner ny jobb. Hva er u*?","o":["2 %","11,1 %","10 %","3,6 %"],"a":2,"w":["2 % er separasjonsraten, ikke ledighetsraten.","Her er nevneren feil: den skal være s + f, ikke bare f.","Riktig — u* = 0,02/(0,02 + 0,18) = 0,10.","Dette er produktet av ratene, som ikke har noen tolkning her."],"s":"Dette er ordrett fra eksamen H25. Vær presis med nevneren: u* = s/(s+f). Med s = 0,02 og f = 0,18 gir det 0,02/0,20 = 10 %. Sjekk gjerne at svaret er en rimelig ledighetsrate."},
{"t":5,"lv":3,"q":"Myndighetene innfører forbud mot oppsigelser. Hva er den mest sannsynlige langsiktige effekten på u*?","o":["u* faller entydig, siden separasjonsraten s går mot null","u* kan stige, fordi jobbfinneraten f også faller","u* er upåvirket, siden bare konjunkturledighet endres","u* blir null, fordi ingen lenger kan miste jobben sin"],"a":1,"w":["Kortsiktig faller ledigheten, men effekten på jobbfinneraten går motsatt vei.","Riktig — lavere s, men også lavere f, og nettoeffekten er tvetydig eller negativ.","Både s og f påvirkes, så u* endres.","Friksjons- og strukturledighet forsvinner ikke."],"s":"Dette er eksamensspørsmålet fra H25 (c). Det gode svaret skiller tydelig mellom kort sikt (færre mister jobben, ledigheten faller) og lang sikt (ansettelser blir en mer risikabel beslutning, f faller, og u* kan ende høyere). Bruk formelen u* = s/(s+f) eksplisitt."},
{"t":5,"lv":2,"q":"Okuns lov, slik den brukes i kurset, sier at","o":["u − u* = −0,5 × Ỹ","u − u* = 0,5 × Ỹ","u = Ỹ","u* = 0,5 × Ỹ"],"a":0,"w":["Riktig — for hvert prosentpoeng produksjonen ligger under potensialet, ligger ledigheten et halvt prosentpoeng over sitt naturlige nivå.","Fortegnet er galt: sammenhengen er invers.","Nivåer og gap blandes sammen.","Den naturlige ledigheten er per definisjon uavhengig av konjunkturene."],"s":"Okuns lov binder sammen realøkonomi og arbeidsmarked, og gjør at man kan oversette et produksjonsgap til et ledighetsgap. Sammenhengen er empirisk, ikke teoretisk utledet, og koeffisienten varierer noe mellom land og perioder."},
{"t":5,"lv":2,"q":"Produksjonsgapet er −4 %. Hva sier Okuns lov om syklisk arbeidsledighet?","o":["Ledigheten ligger 4 prosentpoeng over u*","Ledigheten ligger 2 prosentpoeng over u*","Ledigheten ligger 2 prosentpoeng under u*","Ledigheten er 4 %"],"a":1,"w":["Koeffisienten på 0,5 er utelatt.","Riktig — −0,5 × (−4) = +2 prosentpoeng.","Fortegnet er snudd: negativt gap gir høyere ledighet.","Dette forveksler gapet med selve ledighetsnivået."],"s":"Regn alltid i prosentpoeng over eller under u*, ikke i ledighetsnivå. Vil du ha nivået, må du legge til u*: er u* = 4 %, blir faktisk ledighet 6 %."},
{"t":5,"lv":2,"q":"Hvilken type ledighet forsvinner IKKE selv når økonomien er i likevekt med Ỹ = 0?","o":["Konjunkturledighet","Friksjons- og strukturledighet","All ledighet forsvinner","Bare sesongledighet"],"a":1,"w":["Konjunkturledighet er nettopp den delen som forsvinner når gapet lukkes.","Riktig — summen av friksjons- og strukturledighet er den naturlige ledigheten.","Naturlig ledighet er positiv i alle økonomier.","Sesongvariasjoner er en egen, mindre komponent."],"s":"Faktisk ledighet = friksjonsledighet + strukturledighet (til sammen den naturlige) + konjunkturledighet. Pengepolitikk kan påvirke den siste komponenten, men bare strukturpolitikk kan flytte de to første."},
{"t":5,"lv":3,"q":"Mer sjenerøse dagpenger vil i strømmemodellen typisk","o":["senke u*, fordi ledige har bedre råd til å vente på riktig jobb","heve u*, fordi jobbfinneraten f faller når søkingen svekkes","ikke påvirke u*, siden dagpenger er en ren overføring","senke separasjonsraten s, fordi færre velger å slutte selv"],"a":1,"w":["Bedre forsikring er et velferdsgode, men senker ikke ledigheten i modellen.","Riktig — lavere f gir høyere u* = s/(s+f).","Dagpenger påvirker søkeatferden og dermed f.","Dagpenger virker på jobbsøkingen, ikke primært på oppsigelsene."],"s":"Den fullstendige drøftingen har to sider: sjenerøse dagpenger kan gi høyere målt ledighet, men også bedre matching mellom arbeidstaker og jobb, fordi folk får tid til å finne riktig jobb i stedet for den første. Dette er en klassisk avveining mellom forsikring og insentiv."},
{"t":5,"lv":2,"q":"Hva er forskjellen på friksjonsledighet og strukturledighet?","o":["Friksjonsledighet skyldes søketid, strukturledighet manglende match","Friksjonsledighet er langvarig, mens strukturledighet er kortvarig","De to begrepene beskriver nøyaktig det samme fenomenet","Friksjonsledighet skyldes konjunkturer, strukturledighet ikke"],"a":0,"w":["Riktig — søketid mot mismatch mellom tilbud og etterspørsel av kompetanse.","Det er typisk motsatt: strukturledighet er den mest langvarige.","De har ulike årsaker og krever ulike tiltak.","Konjunkturledighet er en tredje kategori."],"s":"Skillet har politikkbetydning: friksjonsledighet reduseres av bedre informasjon og formidling, strukturledighet av omskolering, utdanning og mobilitet. Ingen av delene løses med pengepolitikk."},
{"t":6,"lv":1,"q":"Kvantitetsligningen for penger er","o":["M·V = P·Y","M + V = P + Y","M/V = P·Y","M·P = V·Y"],"a":0,"w":["Riktig — pengemengde ganger omløpshastighet er lik nominelt BNP.","Ligningen er multiplikativ, ikke additiv.","Omløpshastigheten skal multipliseres inn, ikke divideres.","Variablene er byttet om."],"s":"Ligningen er en identitet gitt hvordan V defineres. Den blir en teori først når man legger til antakelser: konstant V, eksogen M og reelt BNP bestemt av realøkonomiske forhold. Da følger inflasjonen av pengemengdeveksten."},
{"t":6,"lv":2,"q":"Pengemengden vokser 5 % årlig og realt BNP 2 %. Hva blir inflasjonen ifølge kvantitetsteorien, med konstant V?","o":["2 %","3 %","5 %","7 %"],"a":1,"w":["Dette er BNP-veksten, ikke inflasjonen.","Riktig — π = g_M − g_Y = 5 − 2.","Dette forutsetter at realt BNP ikke vokser i det hele tatt.","Her er vekstratene summert i stedet for subtrahert."],"s":"Ta logaritmen av MV = PY og deriver: g_M + g_V = π + g_Y. Med konstant V faller g_V bort. Konklusjonen — «inflasjon er alltid og overalt et monetært fenomen» — gjelder på lang sikt, og særlig ved høy inflasjon og hyperinflasjon."},
{"t":6,"lv":2,"q":"Hva innebærer den klassiske dikotomien?","o":["At penger og produksjon måles i den samme enheten","At den reelle og den nominelle siden er atskilte på lang sikt","At sentralbanken ikke kan påvirke inflasjonen på noe tidspunkt","At priser og lønninger er stive også på lang sikt"],"a":1,"w":["Dikotomien handler om atskillelse, ikke om måleenheter.","Riktig — nominelle størrelser bestemmer prisnivået, reelle størrelser bestemmer produksjonen.","Sentralbanken bestemmer nettopp inflasjonen på lang sikt.","Prisstivhet er en kortsiktsantakelse, motsatt av dikotomien."],"s":"Tankeeksperimentet i forelesningen: bytt ut alle sedler med nye sedler der alle priser er de samme tallene. Ingenting reelt har skjedd, fordi bare relative priser betyr noe. Dette er pengenøytralitet — en god beskrivelse på lang sikt, men ikke på kort sikt."},
{"t":6,"lv":2,"q":"Hvorfor har penger reelle virkninger på kort sikt, men ikke på lang sikt?","o":["Fordi pengemengden bare endres sjelden i praksis","Fordi priser er trege på kort sikt, men justeres fullt ut senere","Fordi pengemengden er konstant på kort sikt og variabel senere","Fordi realrenten alltid ligger fast på det nøytrale nivået"],"a":1,"w":["Dette er ikke et økonomisk argument.","Riktig — nominelle stivheter er hele grunnlaget for kortsiktsmodellen.","Pengemengden kan endres når som helst.","Realrenten varierer nettopp på kort sikt."],"s":"Kontrakter, menykostnader og koordineringsproblemer gjør at priser ikke justeres kontinuerlig. Derfor slår en endring i nominell rente gjennom til realrenten og påvirker etterspørselen. Over tid tilpasser prisene seg, og den klassiske dikotomien gjenopprettes."},
{"t":6,"lv":3,"q":"Hva er hovedårsaken til hyperinflasjon historisk?","o":["Uvanlig høy produktivitetsvekst gjennom en lang periode","At staten finansierer budsjettunderskudd med å trykke penger","Lønnsvekst langt utover det bedriftene faktisk kan bære","At pengenes omløpshastighet faller kraftig og varig"],"a":1,"w":["Produktivitetsvekst virker snarere dempende på prisveksten.","Riktig — seigniorage som budsjettfinansiering, ofte i krig eller institusjonelt sammenbrudd.","Lønnsvekst kan gi inflasjon, men ikke i hyperinflasjonens størrelsesorden.","Ved hyperinflasjon stiger omløpshastigheten kraftig, fordi ingen vil holde penger."],"s":"Mekanismen er selvforsterkende: når folk forventer høy inflasjon, kvitter de seg raskere med penger, V stiger, og inflasjonen akselererer. Løsningen krever alltid at den underliggende budsjettbalansen ordnes — en pengereform alene er ikke nok."},
{"t":6,"lv":2,"q":"Uventet høy inflasjon omfordeler typisk","o":["fra låntakere til långivere","fra långivere til låntakere","fra staten til husholdningene","ingen omfordeling finner sted"],"a":1,"w":["Det er motsatt: långiveren får tilbake penger med lavere kjøpekraft.","Riktig — realverdien av nominell gjeld faller.","Staten er en stor nettolåntaker og tjener typisk på uventet inflasjon.","Omfordelingen kan være betydelig."],"s":"Poenget er at inflasjonen må være uventet. Er den ventet, prises den inn i den nominelle renten gjennom Fisher-ligningen, og ingen omfordeling skjer. Det er derfor uforutsigbar inflasjon er dyrere for samfunnet enn høy, men stabil inflasjon."},
{"t":6,"lv":3,"q":"Hvorfor har mange sentralbanker et inflasjonsmål på 2 % og ikke 0 %?","o":["Fordi 2 % er et enklere tall å regne med i praksis","Fordi det gir avstand ned til nullrentegrensen","Fordi 0 % inflasjon er teknisk umulig å oppnå","Fordi høyere inflasjon gir varig høyere produksjon"],"a":1,"w":["Valget er begrunnet økonomisk, ikke regneteknisk.","Riktig — pluss nedadgående stivhet i nominelle lønninger.","Null inflasjon er teknisk mulig, men lite ønskelig.","Langsiktig nøytralitet gjør at inflasjon ikke kjøper produksjon."],"s":"Tre begrunnelser: et positivt mål gir realrenten rom til å bli negativ, det kompenserer for målefeil i KPI, og det gjør det mulig å justere relative reallønninger ned uten nominelle lønnskutt, som møter sterk motstand."},
{"t":7,"lv":1,"q":"Produksjonsgapet Ỹ er definert som","o":["(Y − Ȳ)/Ȳ, altså faktisk minus potensielt i prosent","Y − Ȳ målt i kroner, altså differansen i nivå","forholdet Y/Ȳ mellom faktisk og potensielt nivå","veksten i realt BNP fra samme kvartal i fjor"],"a":0,"w":["Riktig — et relativt mål, som gjør det sammenlignbart over tid og mellom land.","Gapet uttrykkes normalt i prosent, ikke i nivå.","Dette er forholdstallet, ikke gapet.","BNP-vekst og produksjonsgap er to ulike ting."],"s":"Positivt gap betyr at økonomien produserer over sitt bærekraftige nivå — høykonjunktur og press på priser og lønninger. Negativt gap betyr ledig kapasitet. Merk at høy vekst og positivt gap ikke er det samme: et land kan vokse raskt og fortsatt ligge under potensialet."},
{"t":7,"lv":2,"q":"Faktisk BNP er 520 og potensielt BNP 500. Hva er produksjonsgapet?","o":["+20 %","+4 %","−4 %","+3,8 %"],"a":1,"w":["20 er differansen i nivå, ikke i prosent.","Riktig — (520 − 500)/500 = 0,04.","Fortegnet er snudd; faktisk ligger over potensielt.","Her er det dividert på faktisk BNP i stedet for på potensielt."],"s":"Nevneren er alltid potensielt BNP. Med Okuns lov kan du oversette dette til arbeidsmarkedet: +4 % gap gir en ledighet om lag 2 prosentpoeng under det naturlige nivået."},
{"t":7,"lv":2,"q":"Hvilken av disse er IKKE en vanlig metode for å anslå potensielt BNP?","o":["Produksjonsfunksjonsmetoden","HP-filter på BNP-serien","Indikatorbasert skjønn med kapasitetsutnyttelse og arbeidsmarkedsdata","Å bruke fjorårets faktiske BNP direkte"],"a":3,"w":["Denne bygger opp potensialet fra arbeidskraft, kapital og TFP.","HP-filteret er den vanligste rent statistiske metoden.","Norges Bank kombinerer nettopp flere indikatorer med skjønn.","Riktig — fjorårets BNP er et faktisk tall, ikke et anslag på bærekraftig kapasitet."],"s":"Potensielt BNP er ikke observerbart, og valg av metode påvirker anslaget på produksjonsgapet betydelig. Det er derfor Norges Bank oppgir usikkerhetsbånd og bruker flere metoder parallelt — et godt poeng i en drøftingsoppgave."},
{"t":7,"lv":3,"q":"Hva er endepunktsproblemet ved HP-filteret?","o":["At filteret ikke kan anvendes på kvartalsvise serier","At trenden er mest usikker i starten og slutten av serien","At det bare kan brukes på nominelle, ikke reelle serier","At det gir negative trendverdier i lange tidsserier"],"a":1,"w":["Filteret brukes rutinemessig på kvartalstall.","Riktig — og det er slutten som betyr noe, siden det er nåsituasjonen politikken skal reagere på.","Filteret brukes på realserier uten problemer.","Trendverdier blir ikke negative for BNP-serier."],"s":"I sanntid mangler man framtidige observasjoner, så trenden ved seriens slutt blir kraftig revidert etter hvert som nye data kommer. Konsekvensen er at sanntidsanslag for produksjonsgapet kan være systematisk feil — noe som er en reell utfordring for pengepolitikken."},
{"t":7,"lv":2,"q":"Hva kjennetegner en typisk resesjon ifølge kurset?","o":["At BNP-veksten er positiv, men lavere enn året før","At faktisk BNP faller under potensielt BNP","At inflasjonen alltid stiger gjennom hele nedgangen","At arbeidsledigheten faller mens produksjonen svekkes"],"a":1,"w":["Lavere vekst er ikke i seg selv en resesjon.","Riktig — starten defineres ved at gapet blir negativt, slutten ved at veksten tar seg opp igjen.","Inflasjonen faller typisk i en etterspørselsdrevet resesjon.","Ledigheten stiger i resesjoner, jf. Okuns lov."],"s":"Jones beskriver en typisk amerikansk resesjon: produksjonen ligger under potensialet i om lag to år, BNP faller med rundt 6 % i forhold til trend, og ledigheten stiger markert. Merk at resesjonen kan være over lenge før gapet er lukket."},
{"t":7,"lv":2,"q":"Hvorfor er priser og lønninger trege på kort sikt?","o":["Fordi bedriftene ikke kjenner til sine egne kostnader godt nok","På grunn av kontrakter, menykostnader og koordinering","Fordi sentralbanken i praksis forbyr hyppige prisendringer","Fordi inflasjonen er null og prisene derfor ligger fast"],"a":1,"w":["Bedriftene har som regel god oversikt over egne kostnader.","Riktig — nominelle stivheter er mikrofundamentet for hele kortsiktsmodellen.","Prisregulering er ikke en generell forklaring.","Prisstivhet gjelder uavhengig av inflasjonsnivået."],"s":"Uten prisstivhet ville pengepolitikken vært uten realøkonomisk virkning: en renteendring ville umiddelbart blitt spist opp av tilsvarende prisendringer. Prisstivhet er derfor forutsetningen som gjør at sentralbanken kan styre realrenten og dermed etterspørselen."},
{"t":8,"lv":1,"q":"IS-kurven i kortsiktsmodellen er","o":["Ỹ_t = ā − b̄(R_t − r̄)","R_t = r̄ + m̄(π_t − π̄)","π_t = π_{t−1} + v̄Ỹ_t + ō","Ỹ_t = ā − b̄m̄(π_t − π̄)"],"a":0,"w":["Riktig — produksjonsgapet som funksjon av avviket mellom realrenten og den nøytrale renten.","Dette er MP-kurven.","Dette er Phillips-kurven / AS.","Dette er AD-kurven, som følger av IS og MP kombinert."],"s":"Merk at det er realrenten R, ikke den nominelle, som står i IS-kurven — fordi det er kjøpekraftsavkastningen som styrer investering og sparing. Og det er avviket fra r̄ som betyr noe: ved R = r̄ er Ỹ = ā."},
{"t":8,"lv":2,"q":"Hva representerer parameteren b̄ i IS-kurven?","o":["Den nøytrale realrenten i økonomien på lang sikt","Hvor følsom etterspørselen er for renteendringer","Nivået på autonom etterspørsel uavhengig av renten","Sentralbankens reaksjon på avvik fra inflasjonsmålet"],"a":1,"w":["Det er r̄.","Riktig — stor b̄ betyr at små renteendringer gir store utslag i produksjonsgapet.","Det er ā.","Det er m̄ i MP-kurven."],"s":"b̄ avgjør hvor kraftig pengepolitikken virker. I en økonomi med mye gjeld til flytende rente, som den norske, er b̄ relativt stor — en renteendring slår raskt inn i husholdningenes disponible inntekt og dermed i konsumet."},
{"t":8,"lv":2,"q":"Hvilken av disse endringene skifter IS-kurven, og ikke bare flytter oss langs den?","o":["En endring i realrenten R","En varig økning i offentlige utgifter","En endring i inflasjonen","En endring i sentralbankens styringsrente"],"a":1,"w":["Renteendringer gir bevegelse langs IS.","Riktig — offentlig etterspørsel inngår i ā, og ā skifter kurven.","Inflasjonen påvirker IS bare gjennom realrenten, altså langs kurven.","Styringsrenten virker gjennom R, altså langs kurven."],"s":"Regelen er den samme som ellers: en endring i en variabel som står på aksen gir bevegelse langs kurven, mens en endring i en parameter gir skift. På IS-kurven står R og Ỹ på aksene; ā og b̄ er parametrene."},
{"t":8,"lv":2,"q":"Med ā = 0, b̄ = 0,5, R = 4 % og r̄ = 2 %, hva er produksjonsgapet?","o":["+1 %","−1 %","−2 %","−4 %"],"a":1,"w":["Fortegnet er snudd: realrenten ligger over den nøytrale, altså stram politikk.","Riktig — Ỹ = 0 − 0,5 × (4 − 2) = −1.","Her er b̄ ikke brukt.","Her er r̄ utelatt fra parentesen."],"s":"Sjekk alltid fortegnet mot økonomisk logikk: R over r̄ betyr kontraktiv politikk og dermed negativt produksjonsgap. Er svaret ditt positivt, har du et fortegnsfeil."},
{"t":8,"lv":3,"q":"Hva er det viktigste mikrofundamentet for at høyere realrente reduserer etterspørselen?","o":["At konsumentene av prinsipp misliker å betale renter","At framtidig konsum blir billigere og brukerkostnaden stiger","At bedriftene ikke lenger får låne penger i det hele tatt","At staten automatisk kutter sine utgifter ved høy rente"],"a":1,"w":["Preferanser mot renter er ikke et økonomisk argument.","Riktig — intertemporal substitusjon i konsumet og lavere lønnsomhet i investeringsprosjekter.","Høyere rente gjør lån dyrere, ikke umulig.","Offentlige utgifter er ikke automatisk rentestyrt."],"s":"Investeringen er dessuten den mest volatile komponenten i BNP, og det er derfor rentekanalen virker så kraftig. I tillegg kommer kontantstrømseffekten på husholdninger med flytende rente, og i åpen økonomi valutakanalen."},
{"t":8,"lv":2,"q":"Hvordan kommer nettoeksporten inn i IS-kurven for en åpen økonomi?","o":["Den inngår som en del av autonom etterspørsel ā","Den erstatter realrenten som drivkraft i etterspørselen","Den gjør IS-kurven vertikal i produksjonsgapet","Den inngår ikke i IS-kurven for åpen økonomi"],"a":0,"w":["Riktig — ā_nx er en komponent i ā, påvirket av utenlandsk etterspørsel og valutakurs.","Realrenten står fortsatt sentralt i kurven.","Kurven er fortsatt fallende i R.","For en liten åpen økonomi som Norge er nettoeksporten svært viktig."],"s":"For Norge er eksport- og importandelene høye (om lag 38 og 29 prosent av BNP), langt over USAs nivå. Det betyr at sjokk i utenlandsk etterspørsel og i valutakursen slår kraftig inn i ā — og at rentesettingen har en ekstra kanal gjennom kronen."},
{"t":9,"lv":1,"q":"MP-kurven (den pengepolitiske regelen) er","o":["R_t = r̄ + m̄(π_t − π̄)","Ỹ_t = ā − b̄(R_t − r̄)","π_t = π_{t−1} + v̄Ỹ_t","M·V = P·Y"],"a":0,"w":["Riktig — sentralbanken setter realrenten som en funksjon av inflasjonsavviket fra målet.","Dette er IS-kurven.","Dette er Phillips-kurven.","Dette er kvantitetsligningen."],"s":"Regelen er skrevet relativt til r̄: når inflasjonen er på målet, settes realrenten lik den nøytrale. Parameteren m̄ måler hvor aggressivt banken reagerer på inflasjonsavvik."},
{"t":9,"lv":2,"q":"Hvorfor kan sentralbanken styre realrenten på kort sikt?","o":["Fordi den setter realrenten direkte i sine vedtak","Fordi treg inflasjon gjør at i slår gjennom til R = i − π","Fordi den kontrollerer prisnivået gjennom pengemengden","Fordi realrenten alltid er lik den nøytrale renten r̄"],"a":1,"w":["Sentralbanken setter en nominell rente, ikke en realrente.","Riktig — prisstivhet er broen mellom nominell og reell rente.","Prisnivået bestemmes i markedene, ikke av vedtak.","Da ville pengepolitikk vært virkningsløs."],"s":"Snu argumentet for å se hvor viktig det er: med fullstendig fleksible priser ville en renteøkning umiddelbart gitt tilsvarende lavere inflasjon, R ville vært uendret, og pengepolitikken hadde ingen realøkonomisk virkning. Prisstivhet er hele forutsetningen."},
{"t":9,"lv":2,"q":"Taylor-regel: i = π + r̄ + 0,5(π − π̄) + 0,5Ỹ. Med π = 4, r̄ = 2, π̄ = 2 og Ỹ = −1 blir styringsrenten","o":["5,0 %","5,5 %","6,5 %","7,0 %"],"a":2,"w":["Her mangler ett av gapleddene.","Her er produksjonsgapet trukket fra to ganger, eller inflasjonsgapet utelatt.","Riktig — 4 + 2 + 0,5(2) + 0,5(−1) = 6,5.","Her er produksjonsgapet lagt til med feil fortegn."],"s":"Regn i tre steg: nøytral nominell rente π + r̄ = 6, pluss inflasjonsgap +1, minus produksjonsgap −0,5. Kontroll til slutt: R = 6,5 − 4 = 2,5 % > r̄ = 2 %, altså kontraktiv politikk — som er riktig når inflasjonen ligger over målet."},
{"t":9,"lv":2,"q":"Samme Taylor-regel, men nå med π = 1, r̄ = 2, π̄ = 2 og Ỹ = −2. Hva blir i?","o":["1,5 %","2,0 %","2,5 %","0,5 %"],"a":0,"w":["Riktig — 1 + 2 + 0,5(−1) + 0,5(−2) = 1,5 %.","Her mangler produksjonsgapleddet.","Her er inflasjonsgapet lagt til med feil fortegn.","Her er nøytral rente utelatt."],"s":"Kontroll: R = 1,5 − 1 = 0,5 % < r̄ = 2 %, altså ekspansiv politikk. Det stemmer med at både inflasjonen ligger under målet og produksjonen under potensialet — begge trekker i samme retning, slik de gjør ved etterspørselssjokk."},
{"t":9,"lv":3,"q":"Hva er Taylor-prinsippet?","o":["At styringsrenten skal settes nøyaktig lik inflasjonen","At nominell rente må heves mer enn én-til-én med inflasjonen","At renten bør holdes uendret gjennom konjunktursykelen","At inflasjonsmålet bør ligge på 2 % og ikke høyere"],"a":1,"w":["Da ville realrenten vært konstant og politikken uten stabiliserende kraft.","Riktig — koeffisienten på π må overstige 1, som i regelen der den er 1 + 0,5.","Passiv politikk gir ustabil inflasjon.","Målnivået er en separat beslutning."],"s":"Brytes prinsippet, faller realrenten når inflasjonen stiger, og politikken virker ekspansivt akkurat når den burde stramme til. Da kan inflasjonen bli selvforsterkende — en vanlig diagnose av pengepolitikken på 1970-tallet."},
{"t":9,"lv":2,"q":"Den nominelle renten er 4,5 % og inflasjonen 3 %. Hva er realrenten?","o":["7,5 %","1,5 %","1,3 %","3 %"],"a":1,"w":["Her er størrelsene addert i stedet for subtrahert.","Riktig — R ≈ i − π = 4,5 − 3.","Dette ville vært en eksakt beregning etter en annen formel enn kursets tilnærming.","Dette er inflasjonen, ikke realrenten."],"s":"Sjekk alltid om realrenten ligger over eller under din antatte r̄: er R < r̄, er politikken ekspansiv, er R > r̄, er den kontraktiv. Denne kontrollen fanger de fleste regnefeil i Taylor-oppgaver."},
{"t":9,"lv":2,"q":"Hva skjer hvis sentralbanken hever den nominelle renten med mindre enn økningen i inflasjonen?","o":["Realrenten stiger og politikken strammer til","Realrenten faller og politikken virker ekspansivt","Realrenten er uendret","Inflasjonen faller automatisk"],"a":1,"w":["Realrenten kan bare stige om nominell rente økes mer enn inflasjonen.","Riktig — R = i − π faller når π stiger mer enn i.","Uendret realrente krever nøyaktig én-til-én-respons.","En ekspansiv realrente presser inflasjonen videre opp."],"s":"Dette er Taylor-prinsippet snudd på hodet, og det er den vanligste kilden til feiltolkning av renteendringer i mediene: en renteøkning kan i praksis være ekspansiv hvis inflasjonen har steget mer."},
{"t":9,"lv":2,"q":"Hvorfor må pengepolitikken være fremoverskuende?","o":["Fordi inflasjonstallene publiseres med lang forsinkelse","Fordi renteendringer virker med et etterslep på ett til to år","Fordi sentralbanken ikke kjenner dagens inflasjonsnivå","Fordi finansmarkedene krever prognoser fra sentralbanken"],"a":1,"w":["Publiseringsforsinkelsen er kort og ikke hovedgrunnen.","Riktig — banken må reagere på prognosen, ikke på dagens tall.","Dagens inflasjon er godt kjent.","Kravet følger av transmisjonsetterslepet, ikke av markedspress."],"s":"Konsekvensen er rentebanen i Pengepolitisk rapport: en prognose for framtidig rente basert på prognosen for inflasjon og produksjonsgap. Det gjør også at kommunikasjon i seg selv blir et virkemiddel, fordi forventninger om framtidig rente påvirker lange renter i dag."},
{"t":9,"lv":2,"q":"Norges Bank driver fleksibel inflasjonsmålstyring. Hva betyr «fleksibel»?","o":["At inflasjonsmålet justeres fra år til år etter behov","At banken også vektlegger produksjon og sysselsetting","At renten kan settes fritt uten offentlig begrunnelse","At målet bare gjelder i perioder med god vekst"],"a":1,"w":["Målet ligger fast på 2 %.","Riktig — derfor tas inflasjonen tilbake til målet over tid, ikke umiddelbart.","Beslutningene begrunnes offentlig i Pengepolitisk rapport.","Målet gjelder til enhver tid."],"s":"Fleksibiliteten er nettopp det som gjør avveiningen ved tilbudssjokk mulig å håndtere: banken kan velge en langsommere innhenting av inflasjonen for å skåne realøkonomien. En streng inflasjonsmålstyrer måtte tatt hele kostnaden umiddelbart."},
{"t":9,"lv":3,"q":"Hvorfor er sentralbankuavhengighet ansett som viktig?","o":["Fordi sentralbanksjefen kan mer om økonomi enn politikerne gjør","Fordi politikere har kortsiktige insentiver som svekker troverdigheten","Fordi sentralbankloven krever det av rent formelle grunner","Fordi uavhengige sentralbanker gir varig lavere realrente"],"a":1,"w":["Kompetanse er ikke hovedargumentet i litteraturen.","Riktig — dette er tidsinkonsistensproblemet.","Loven er en konsekvens av argumentet, ikke begrunnelsen.","Uavhengighet påvirker troverdigheten, ikke den nøytrale renten."],"s":"Er inflasjonsmålet troverdig, forankres forventningene, og AS-kurven flytter seg mindre ved sjokk. Da blir både inflasjonen mer stabil og kostnaden ved disinflasjon mindre — troverdighet er i praksis billigere enn ledighet."},
{"t":9,"lv":3,"q":"Hvilken av disse er IKKE en vanlig transmisjonskanal for pengepolitikken i Norge?","o":["Renteutgifter og disponibel inntekt for husholdninger med flytende rente","Valutakursen og importerte priser","Formuespriser som bolig og aksjer","Direkte statlig prisregulering av dagligvarer"],"a":3,"w":["Denne er særlig sterk i Norge på grunn av høy gjeld og flytende rente.","Kronekanalen er sentral for en liten åpen økonomi.","Endret rente påvirker boligpriser og dermed konsum.","Riktig — prisregulering er ikke et pengepolitisk virkemiddel."],"s":"Å nevne flere kanaler er en enkel måte å heve svaret på i Oppgave 3. I Norge er kontantstrømkanalen uvanlig sterk, fordi de fleste husholdningslån har flytende rente — renteendringer treffer disponibel inntekt nesten umiddelbart."},
{"t":10,"lv":1,"q":"AD-kurven framkommer ved å","o":["kombinere IS-kurven og MP-kurven","kombinere Phillips-kurven og Okuns lov","derivere produksjonsfunksjonen","sette sammen kvantitetsligningen og IS"],"a":0,"w":["Riktig — sett MP inn i IS, og du får Ỹ_t = ā − b̄m̄(π_t − π̄).","Dette gir sammenhengen mellom inflasjon og ledighet, ikke AD.","Produksjonsfunksjonen hører til langsiktsmodellen.","Kvantitetsligningen inngår ikke i kortsiktsmodellen."],"s":"Poenget med substitusjonen er at renten elimineres som eksplisitt variabel: AD viser hvilket produksjonsgap som blir resultatet ved hver inflasjonsrate, gitt at sentralbanken følger sin regel. Renten ligger implisitt i kurven."},
{"t":10,"lv":1,"q":"AS-kurven i modellen er identisk med","o":["IS-kurven","Phillips-kurven","MP-kurven","Okuns lov"],"a":1,"w":["IS er etterspørselssiden.","Riktig — π_t = π_{t−1} + v̄Ỹ_t + ō.","MP er rentesettingsregelen.","Okuns lov kobler gap og ledighet."],"s":"AS er altså en dynamisk relasjon: dagens inflasjon avhenger av forrige periodes inflasjon (adaptive forventninger), av presset i økonomien (v̄Ỹ) og av tilbudssjokk (ō). Nettopp fordi π_{t−1} inngår, flytter kurven seg mellom periodene."},
{"t":10,"lv":2,"q":"Hva er likevekten («steady state») i kortsiktsmodellen?","o":["Ỹ* = 0, π* = π̄, R* = r̄","Ỹ* = ā, π* = 0, R* = 0","Ỹ* > 0 og π* > π̄","Likevekt finnes ikke i en dynamisk modell"],"a":0,"w":["Riktig — alle tre samtidig, og det er et nyttig kontrollpunkt.","Nullinflasjon er ikke målet, og R* er den nøytrale renten.","Dette er en midlertidig tilstand, ikke likevekten.","Modellen har en veldefinert langsiktig likevekt."],"s":"Bruk dette som sjekk på alle dynamikkoppgaver: ender svaret ditt et annet sted, må det skyldes at en parameter er permanent endret. Ved permanent høyere ā ender π over π̄, men Ỹ er fortsatt null — produksjonen vender alltid tilbake."},
{"t":10,"lv":2,"q":"Hvilken av disse skifter AD-kurven?","o":["En endring i inflasjonen π","En endring i den nøytrale realrenten r̄","En varig økning i ā","En endring i forrige periodes inflasjon"],"a":2,"w":["π står på aksen, så en endring gir bevegelse langs kurven.","r̄ faller ut når IS og MP kombineres.","Riktig — ā står igjen i AD-uttrykket og skifter kurven.","π_{t−1} skifter AS, ikke AD."],"s":"AD-uttrykket er Ỹ = ā − b̄m̄(π − π̄). Det som står igjen i uttrykket kan skifte kurven: ā (og f̄ med motsatt fortegn) skifter den, mens m̄ og b̄ roterer den. r̄ er borte og kan derfor ikke skifte noe."},
